<style>
  /* ライト版 (GROOVE と同じ骨格: Inter / 1px細線 / 角なし / 紙のような地) */
  :root{
    --bg:#f4f1ea; --panel:#fbfaf6; --panel2:#efece4; --line:#d9d4c8; --txt:#2a2c30; --dim:#8a8d93;
    --teal:#3f8f98; --red:#b8574b; --pc:#3f8f98;
  }
  *{box-sizing:border-box;border-radius:0}
  body{font-family:'Inter',-apple-system,sans-serif;margin:0;background:var(--bg);color:var(--txt);
       font-size:15px;font-weight:300;letter-spacing:.01em;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
         padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  h1{font-size:19px;margin:0 8px 0 0;font-weight:400;letter-spacing:.1em;white-space:nowrap}
  header .sp{flex:1 1 0}
  a.home{font-size:12px;letter-spacing:.1em;color:var(--dim);text-decoration:none}
  button{font:inherit;font-weight:400;font-size:13px;letter-spacing:.04em;padding:7px 12px;
         border:1px solid var(--line);background:transparent;color:var(--txt);cursor:pointer;white-space:nowrap;touch-action:manipulation}
  button:hover{background:#ebe7dd;border-color:#bfb9ab}
  button.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
  #play{min-width:84px;border-color:var(--teal);color:var(--teal)}
  #play.on{background:var(--teal);color:#fff}
  label.f{font-size:11px;color:var(--dim);letter-spacing:.08em;display:flex;align-items:center;gap:6px;white-space:nowrap}
  label.f b{font-weight:500;color:var(--txt);min-width:2.4em;display:inline-block;text-align:right}
  input[type=range]{accent-color:var(--pc);width:90px}
  select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);background:var(--panel);color:var(--txt)}
  main{max-width:980px;margin:0 auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:14px}

  /* パートの帯: 7本。各行に全ステップのミニ表示 */
  .parts{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--panel)}
  .prow{display:grid;grid-template-columns:118px 1fr 58px;align-items:center;gap:8px;padding:5px 8px;border-top:1px solid var(--line);cursor:pointer}
  .prow:first-child{border-top:none}
  .prow.sel{background:var(--panel2);box-shadow:inset 3px 0 0 var(--c)}
  .prow .nm{display:flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}
  .prow .nm i{width:10px;height:10px;background:var(--c);flex:none}
  .prow .nm span{color:var(--dim);font-size:11px}
  .prow canvas{width:100%;height:22px;display:block}
  .prow .ms{display:flex;gap:3px;justify-content:flex-end}
  .prow .ms button{padding:2px 0;width:26px;font-size:11px}
  .prow.muted canvas,.prow.muted .nm{opacity:.35}
  .ms button.m.on{background:var(--red);border-color:var(--red);color:#fff}
  .ms button.s.on{background:#c98a2e;border-color:#c98a2e;color:#fff}

  /* 選んだパートの設定 */
  .pbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .pbar .ttl{font-size:16px;font-weight:400;letter-spacing:.06em;display:flex;align-items:center;gap:8px;margin-right:6px}
  .pbar .ttl i{width:14px;height:14px;background:var(--pc)}
  .pbar .sp{flex:1}

  /* グリッド */
  .gwrap{overflow-x:auto;border:1px solid var(--line);background:var(--panel);-webkit-overflow-scrolling:touch}
  .gin{display:grid;grid-template-columns:62px 1fr;min-width:calc(62px + var(--steps) * 18px)}
  .labels{display:grid;grid-template-rows:repeat(16,1fr);border-right:1px solid var(--line)}
  .labels div{font-size:10.5px;color:var(--dim);display:flex;align-items:center;gap:5px;padding:0 6px;cursor:pointer;
              border-top:1px solid var(--panel2);white-space:nowrap;overflow:hidden;user-select:none;height:26px}
  .labels div:hover{color:var(--txt);background:var(--panel2)}
  .labels div i{width:6px;height:6px;flex:none}
  .labels div.w{color:var(--txt)}
  .grid{position:relative;display:grid;grid-template-columns:repeat(var(--steps),1fr);grid-template-rows:repeat(16,26px);
        touch-action:none;user-select:none;cursor:crosshair}
  .grid .c{border-left:1px solid var(--panel2);border-top:1px solid var(--panel2)}
  .grid .c.beat{border-left-color:var(--line)}
  .grid .c.alt{background:rgba(0,0,0,.018)}
  .grid .c.ph{background:rgba(63,143,152,.12)}
  .grid .n{background:var(--pc);margin:2px 1px;position:relative;z-index:2;pointer-events:none;opacity:.92}
  .grid .n.hit{filter:brightness(1.25);box-shadow:0 0 0 2px rgba(255,255,255,.7) inset}
  .hint{font-size:12px;color:var(--dim);line-height:1.7}
  .hint b{font-weight:500;color:var(--txt)}
  .foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .foot .sp{flex:1}
  #msg{font-size:12px;color:var(--dim)}
  @media(max-width:560px){
    header{position:static}
    .prow{grid-template-columns:86px 1fr 56px}
    .prow .nm span{display:none}
    input[type=range]{width:70px}
  }

<script>
'use strict';
/* =====================================================================
   PONKEY STEP — P1〜P7 のステップシーケンサー。音はすべてブラウザ (WebAudio) で作る。
   パート構成は本体と同じ (Ponkey.PARTS):
     P1 = ドラム。16鍵 = 16打楽器 (Ponkey.KIT_NOTES の GM ノート)。行は列=系統でまとめる
     P2-P7 = メロディ。16鍵 = 白鍵16本 (KEYS/LEAD/CHORD/BELL/VOICE は C3-D5、BASS は C1-D3)
             + パートの音域シフト (LEAD +12 / BELL +24)
   ノートは {s:ステップ, k:鍵(0-15), l:長さ(ステップ数)}。メロディの k は低い方から 0。
   外部ライブラリは使わない (オフラインでも開ける)。
   ===================================================================== */
const PARTS = Ponkey.PARTS, KIT_NOTES = Ponkey.KIT_NOTES;
const KIT_NAMES = ['トイ','オーケストラ','バンド','ゲーム','宇宙','ヘンテコ','ボイス','ワールド'];
const COL_NAMES = Ponkey.KIT_COL_NAMES;
const COL_HUE = [0, 130, 220, 320];
const STORE = 'ponkey_step_v01';
const partColor = (p, l = 50) => `hsl(${PARTS[p].hue},62%,${l}%)`;

// メロディの16鍵 → 低い順の音高
const sortedTable = p => PARTS[p].table.slice().sort((a, b) => a - b);
const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const noteName = m => NAMES[m % 12] + (Math.floor(m / 12) - 1);

// GM ドラムの短い名前 (ラベル用)
const GM = {35:'キック2',36:'キック',37:'リム',38:'スネア',39:'クラップ',40:'スネア2',41:'タム低',42:'ハット',43:'タム低2',
  44:'ペダルHH',45:'タム中',46:'オープンHH',47:'タム中2',48:'タム高',49:'クラッシュ',50:'タム高2',51:'ライド',52:'チャイナ',
  53:'ライドベル',54:'タンバリン',55:'スプラッシュ',56:'カウベル',57:'クラッシュ2',58:'ビブラスラップ',59:'ライド2',
  60:'ボンゴ高',61:'ボンゴ低',62:'コンガM',63:'コンガ高',64:'コンガ低',65:'ティンバレ高',66:'ティンバレ低',67:'アゴゴ高',
  68:'アゴゴ低',69:'カバサ',70:'マラカス',71:'ホイッスル',72:'ロングWh',73:'ギロ',74:'ロングギロ',75:'クラベス',
  76:'ウッド高',77:'ウッド低',78:'クイーカM',79:'クイーカ',80:'トライアングルM',81:'トライアングル'};

/* ---------------- 状態 ---------------- */
function blankState() {
  return { v: 1, bpm: 110, swing: 0, steps: 16, master: 80, kit: 0,
    parts: PARTS.map((_, i) => ({ notes: [], mute: false, solo: false, vol: 75, oct: 0 })) };
}
let S = load() || demoState();
let sel = 0;

function load() {
  try {
    const o = JSON.parse(localStorage.getItem(STORE));
    return sanitize(o);
  } catch (e) { return null; }
}
function sanitize(o) {
  if (!o || !Array.isArray(o.parts) || o.parts.length !== 7) return null;
  const b = blankState();
  b.bpm = clamp(+o.bpm || 110, 60, 180); b.swing = clamp(+o.swing || 0, 0, 60);
  b.steps = o.steps == 32 ? 32 : 16; b.master = clamp(o.master ?? 80, 0, 100); b.kit = clamp(o.kit | 0, 0, 7);
  o.parts.forEach((p, i) => {
    const q = b.parts[i];
    q.mute = !!p.mute; q.solo = !!p.solo; q.vol = clamp(p.vol ?? 75, 0, 100); q.oct = clamp(p.oct | 0, -2, 2);
    q.notes = (p.notes || []).filter(n => n && n.s >= 0 && n.s < 32 && n.k >= 0 && n.k < 16)
      .map(n => ({ s: n.s | 0, k: n.k | 0, l: i === 0 ? 1 : clamp(n.l | 0 || 1, 1, 32 - n.s) }));
  });
  return b;
}
let saveT = 0;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }, 200);
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

// お手本: 4つ打ち＋ベース＋和音＋リード＋ベル (Cメジャー)
function demoState() {
  const s = blankState();
  const add = (p, st, k, l = 1) => s.parts[p].notes.push({ s: st, k, l });
  // P1 ドラム (TOYキット: 0=キック 1=スネア 2=ハット 13=クラップ 14=オープンHH 3=タンバリン)
  [0, 4, 8, 12].forEach(t => add(0, t, 0));
  [4, 12].forEach(t => add(0, t, 1));
  [2, 6, 10].forEach(t => add(0, t, 2)); add(0, 14, 14);
  [1, 3, 5, 7, 9, 11, 13, 15].forEach(t => add(0, t, 3));
  // P4 ベース (鍵: 0=C1 … 7=C2 9=E2 11=G2)
  [[0,7,2],[3,7,1],[6,7,1],[8,5,2],[11,5,1],[12,4,2],[14,6,2]].forEach(([t,k,l]) => add(3, t, k, l));
  // P5 わおん (C と F と G)
  add(4, 0, 0, 6); add(4, 8, 3, 4); add(4, 12, 4, 4);
  // P3 リード
  [[0,7,2],[2,9,1],[3,11,3],[8,10,2],[10,9,1],[11,8,1],[12,7,4]].forEach(([t,k,l]) => add(2, t, k - 4, l));
  // P6 ベル
  [[6,11,1],[14,9,1],[15,11,1]].forEach(([t,k,l]) => add(5, t, k, l));
  s.parts[5].vol = 55; s.parts[2].vol = 60;
  return s;
}

/* ---------------- 音 (WebAudio) ---------------- */
let ac = null, master, comp, revIn, noiseBuf;
const bus = [];
function audio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return ac; }
  ac = new (window.AudioContext || window.webkitAudioContext)();
  comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = .003; comp.release.value = .2;
  master = ac.createGain(); master.gain.value = vol01(S.master);
  comp.connect(master); master.connect(ac.destination);
  // 残響: 減衰ノイズのインパルス
  const len = ac.sampleRate * 1.8, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  const conv = ac.createConvolver(); conv.buffer = ir;
  revIn = ac.createGain(); revIn.gain.value = 1;
  const revOut = ac.createGain(); revOut.gain.value = .35;
  revIn.connect(conv); conv.connect(revOut); revOut.connect(comp);
  noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  // パートごとのバス (音量 + 定位 + 残響センド)
  const PAN = [0, -.15, .25, 0, -.3, .35, .1], SEND = [.08, .12, .2, .02, .35, .45, .3];
  PARTS.forEach((_, i) => {
    const g = ac.createGain(), pan = ac.createStereoPanner ? ac.createStereoPanner() : null, snd = ac.createGain();
    snd.gain.value = SEND[i];
    if (pan) { pan.pan.value = PAN[i]; g.connect(pan); pan.connect(comp); } else g.connect(comp);
    g.connect(snd); snd.connect(revIn);
    bus[i] = g;
  });
  applyMix();
  return ac;
}
const vol01 = v => Math.pow(v / 100, 1.6);
function applyMix() {
  if (!ac) return;
  master.gain.setTargetAtTime(vol01(S.master), ac.currentTime, .02);
  const anySolo = S.parts.some(p => p.solo);
  S.parts.forEach((p, i) => {
    const on = !p.mute && (!anySolo || p.solo);
    bus[i].gain.setTargetAtTime(on ? vol01(p.vol) * 1.3 : 0, ac.currentTime, .02);
  });
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

// 小道具: エンベロープ付きの音源
function env(g, t, a, peak, d, sus = 0) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(Math.max(sus, 0.0001), t + a + d);
}
function osc(type, f, t, end, out) {
  const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  o.connect(out); o.start(t); o.stop(end); return o;
}
function noise(t, end, out) {
  const n = ac.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
  n.connect(out); n.start(t, Math.random()); n.stop(end); return n;
}
function filt(type, f, q = 1, out) {
  const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; b.connect(out); return b;
}
function gainTo(out, v = 1) { const g = ac.createGain(); g.gain.value = v; g.connect(out); return g; }

/* ---- ドラム: GM ノート番号から合成 ---- */
function drum(note, t, vel, out) {
  const v = vel;
  const kick = (f0, f1, dec) => {
    const g = gainTo(out); env(g, t, .002, 1.1 * v, dec);
    const o = osc('sine', f0, t, t + dec + .05, g); o.frequency.exponentialRampToValueAtTime(f1, t + .12);
    const c = gainTo(out); env(c, t, .001, .25 * v, .02); osc('square', 1200, t, t + .03, filt('lowpass', 3000, 1, c));
  };
  const nz = (type, f, q, a, dec, peak, end) => {
    const g = gainTo(out); env(g, t, a, peak * v, dec);
    noise(t, t + (end || dec) + .05, filt(type, f, q, g)); return g;
  };
  const tone = (type, f, dec, peak, f2) => {
    const g = gainTo(out); env(g, t, .002, peak * v, dec);
    const o = osc(type, f, t, t + dec + .05, g);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dec * .8);
    return o;
  };
  const metal = (dec, peak, hp) => {   // 金物: 非整数比の矩形波を束ねる
    const g = gainTo(out); env(g, t, .002, peak * v, dec);
    const f = filt('highpass', hp, 1, g);
    [263, 400, 421, 474, 587, 845].forEach(x => osc('square', x * 1.8, t, t + dec + .05, f));
    nz('highpass', hp + 2000, 1, .002, dec * .7, peak * .6);
  };
  switch (note) {
    case 35: kick(130, 42, .5); break;
    case 36: kick(160, 48, .42); break;
    case 37: tone('triangle', 1700, .03, .6); nz('bandpass', 2500, 4, .001, .025, .5); break;
    case 38: case 40: {
      tone('triangle', note === 38 ? 190 : 230, .12, .55, 140);
      nz('highpass', 1600, .7, .001, note === 38 ? .2 : .14, .75); break;
    }
    case 39: { // クラップ: 3回の破裂 + 尾
      [0, .011, .022].forEach(d => { const g = gainTo(out); env(g, t + d, .001, .8 * v, .012); noise(t + d, t + d + .03, filt('bandpass', 1300, 1.2, g)); });
      const g = gainTo(out); env(g, t + .03, .001, .6 * v, .18); noise(t + .03, t + .25, filt('bandpass', 1200, 1, g)); break;
    }
    case 41: case 43: case 45: case 47: case 48: case 50: {
      const f = 75 + (note - 41) * 16; tone('sine', f * 1.6, .32, .9, f); nz('lowpass', 900, 1, .001, .05, .25); break;
    }
    case 42: nz('highpass', 7500, 1, .001, .045, .45); break;
    case 44: nz('highpass', 6500, 1, .001, .07, .35); break;
    case 46: nz('highpass', 7000, .8, .001, .32, .4); break;
    case 49: case 57: metal(1.4, .22, 5000); break;
    case 52: metal(.9, .25, 3000); break;
    case 55: metal(.55, .22, 6000); break;
    case 51: case 59: metal(.7, .12, 8000); tone('sine', 3200, .5, .06); break;
    case 53: tone('sine', 2400, .6, .25); tone('square', 3600, .2, .05); break;
    case 54: { // タンバリン: シャラッ
      [0, .012, .025].forEach((d, i) => { const g = gainTo(out); env(g, t + d, .001, (.4 - i * .1) * v, .09); noise(t + d, t + d + .12, filt('highpass', 7000, 2, g)); });
      break;
    }
    case 56: { const g = gainTo(out); env(g, t, .001, .35 * v, .28); const f = filt('bandpass', 900, 3, g);
      osc('square', 562, t, t + .32, f); osc('square', 845, t, t + .32, f); break; }
    case 58: { const g = gainTo(out); env(g, t, .002, .5 * v, .7); const am = ac.createGain(); am.gain.value = 0;
      am.connect(g); osc('square', 28, t, t + .8, am.gain); noise(t, t + .8, filt('bandpass', 3000, 3, am)); break; }
    case 60: case 61: case 62: case 63: case 64: case 65: case 66: {
      const F = {60:420,61:310,62:270,63:300,64:200,65:480,66:340}[note];
      tone('sine', F * 1.25, note === 62 ? .08 : .22, .8, F);
      if (note >= 65) tone('triangle', F * 2.1, .15, .2);
      break;
    }
    case 67: case 68: { const f = note === 67 ? 920 : 690; tone('sine', f, .25, .45); tone('sine', f * 2.7, .12, .15); break; }
    case 69: nz('highpass', 5000, 1, .01, .08, .4); break;
    case 70: nz('highpass', 6000, 1, .004, .04, .45); break;
    case 71: case 72: { const d = note === 71 ? .09 : .35; const o = tone('sine', 2300, d, .25);
      const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = 30; lg.gain.value = 60; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + d + .05); break; }
    case 73: case 74: { const n = note === 73 ? 5 : 11;
      for (let i = 0; i < n; i++) { const d = i * .022; const g = gainTo(out); env(g, t + d, .002, .35 * v, .016); noise(t + d, t + d + .025, filt('bandpass', 3200, 5, g)); }
      break; }
    case 75: tone('sine', 2500, .05, .6); break;
    case 76: case 77: tone('sine', note === 76 ? 1250 : 880, .06, .6); tone('square', note === 76 ? 2500 : 1760, .02, .1); break;
    case 78: case 79: { const o = tone('sine', note === 79 ? 420 : 520, .18, .5); o.frequency.linearRampToValueAtTime(note === 79 ? 760 : 380, t + .16); break; }
    case 80: case 81: { const d = note === 80 ? .12 : 1.2; tone('sine', 2600, d, .2); tone('sine', 5200 * 1.01, d * .7, .08); break; }
    default: tone('sine', 300, .15, .5);
  }
}

/* ---- メロディ6パート (パートの性格で音色を分ける) ---- */
function melody(p, m, t, dur, vel, out) {
  const f = mtof(m), end = t + dur;
  switch (PARTS[p].name) {
    case 'KEYS': { // ピアノっぽい減衰
      const g = gainTo(out); env(g, t, .004, .5 * vel, Math.min(1.4, dur + .6));
      g.gain.setTargetAtTime(0.0001, end, .08);
      const lp = filt('lowpass', 2200 + f, .5, g);
      osc('triangle', f, t, end + .5, lp); osc('sine', f * 2, t, end + .5, gainTo(lp, .25));
      return end + .5;
    }
    case 'LEAD': {
      const g = gainTo(out); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(.28 * vel, t + .01);
      g.gain.setTargetAtTime(.2 * vel, t + .01, .1); g.gain.setTargetAtTime(0.0001, end, .05);
      const lp = filt('lowpass', 1800, 4, g); lp.frequency.setValueAtTime(5000, t); lp.frequency.exponentialRampToValueAtTime(1600, t + .25);
      const a = osc('sawtooth', f, t, end + .3, lp), b = osc('sawtooth', f, t, end + .3, lp); b.detune.value = 9;
      const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = 5.5; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(7, t + .35);
      l.connect(lg); lg.connect(a.detune); lg.connect(b.detune); l.start(t); l.stop(end + .3);
      return end + .3;
    }
    case 'BASS': {
      const g = gainTo(out); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(.6 * vel, t + .005);
      g.gain.setTargetAtTime(.42 * vel, t + .005, .12); g.gain.setTargetAtTime(0.0001, end, .03);
      const lp = filt('lowpass', 600, 6, g); lp.frequency.setValueAtTime(2200, t); lp.frequency.exponentialRampToValueAtTime(380, t + .18);
      osc('sawtooth', f, t, end + .2, lp); osc('square', f / 2, t, end + .2, gainTo(lp, .5));
      return end + .2;
    }
    case 'CHORD': { // 白鍵上の三和音 (その音 + 2つ上 + 4つ上の白鍵) をパッドで
      const ws = whiteFrom(m, [0, 2, 4]);
      const g = gainTo(out); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(.14 * vel, t + .06);
      g.gain.setTargetAtTime(0.0001, end, .18);
      const lp = filt('lowpass', 2400, .7, g);
      ws.forEach(x => { const a = osc('sawtooth', mtof(x), t, end + .9, lp); a.detune.value = -6;
        const b = osc('triangle', mtof(x), t, end + .9, lp); b.detune.value = 6; });
      return end + .9;
    }
    case 'BELL': { // FM ベル
      const g = gainTo(out); env(g, t, .002, .32 * vel, Math.max(1.2, dur + .8));
      const car = osc('sine', f, t, end + 1.6, g);
      const mod = ac.createOscillator(), mg = ac.createGain();
      mod.frequency.value = f * 3.5; mg.gain.setValueAtTime(f * 2.2, t); mg.gain.exponentialRampToValueAtTime(f * .1, t + 1);
      mod.connect(mg); mg.connect(car.frequency); mod.start(t); mod.stop(end + 1.6);
      return end + 1.6;
    }
    case 'VOICE': { // 「あー」のフォルマント
      const g = gainTo(out); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(.5 * vel, t + .05);
      g.gain.setTargetAtTime(0.0001, end, .1);
      const fs = [[800, 1, 8], [1150, .5, 9], [2900, .25, 10]].map(([F, a, q]) => filt('bandpass', F, q, gainTo(g, a)));
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
      const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = 5; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(10, t + .4);
      l.connect(lg); lg.connect(o.detune);
      fs.forEach(x => o.connect(x)); o.start(t); o.stop(end + .5); l.start(t); l.stop(end + .5);
      return end + .5;
    }
  }
}
const WHITE = [0, 2, 4, 5, 7, 9, 11];
function whiteFrom(m, offs) { // m から白鍵で数えて offs 段上
  const oct = Math.floor(m / 12), i = WHITE.indexOf(m % 12);
  if (i < 0) return offs.map(o => m + o);
  return offs.map(o => { const j = i + o; return (oct + Math.floor(j / 7)) * 12 + WHITE[j % 7]; });
}

function partPitch(p, k) { return sortedTable(p)[k] + PARTS[p].shift + S.parts[p].oct * 12; }

function trigger(p, k, t, dur, vel = 1) {
  if (p === 0) drum(KIT_NOTES[S.kit][k], t, vel, bus[0]);
  else melody(p, partPitch(p, k), t, dur, vel, bus[p]);
}
function preview(p, k) {
  audio();
  // 試聴はミュート/ソロに関係なく鳴らしたいので、一時的にバスを通さず直接出す
  const g = ac.createGain(); g.gain.value = vol01(S.parts[p].vol) * 1.3; g.connect(comp);
  const t = ac.currentTime + .01;
  if (p === 0) drum(KIT_NOTES[S.kit][k], t, 1, g); else melody(p, partPitch(p, k), t, stepDur() * 1.5, 1, g);
}

/* ---------------- シーケンサー (先読みスケジューラ) ---------------- */
let playing = false, nextStep = 0, nextTime = 0, timer = 0;
const queue = [];   // 画面の再生ヘッド用: {step, time}
const stepDur = () => 60 / S.bpm / 4;
function schedule() {
  const ahead = .12;
  while (nextTime < ac.currentTime + ahead) {
    const st = nextStep, sd = stepDur();
    const t = nextTime + (st % 2 ? S.swing / 100 * sd : 0);
    S.parts.forEach((p, i) => {
      for (const n of p.notes) if (n.s === st) {
        const vel = (st % 4 === 0) ? 1 : .82;   // 拍頭を少しだけ強く
        trigger(i, n.k, t, Math.max(.04, n.l * sd - (i === 0 ? 0 : sd * .1)), vel);
      }
    });
    queue.push({ step: st, time: t });
    nextTime += sd;
    nextStep = (nextStep + 1) % S.steps;
  }
}
function play() {
  audio();
  playing = true; nextStep = 0; nextTime = ac.currentTime + .06; queue.length = 0;
  schedule(); timer = setInterval(schedule, 25);
  $('play').classList.add('on'); $('play').textContent = '■ 停止';
}
function stop() {
  playing = false; clearInterval(timer); queue.length = 0; curStep = -1; drawHead();
  $('play').classList.remove('on'); $('play').textContent = '▶ 再生';
}

/* ---------------- 画面 ---------------- */
const $ = id => document.getElementById(id);
let curStep = -1;

function rowsOf(p) {
  // 表示の上から順に 鍵番号 を返す
  if (p === 0) { const r = []; for (let c = 0; c < 4; c++) for (let row = 0; row < 4; row++) r.push(row * 4 + c); return r; }
  return Array.from({ length: 16 }, (_, i) => 15 - i);
}

function buildParts() {
  const box = $('parts'); box.innerHTML = '';
  PARTS.forEach((pt, i) => {
    const r = document.createElement('div'); r.className = 'prow'; r.style.setProperty('--c', partColor(i));
    r.innerHTML = `<div class="nm"><i></i>P${i + 1} ${pt.name}<span>${pt.ja}</span></div><canvas></canvas>
      <div class="ms"><button class="m" title="ミュート">M</button><button class="s" title="ソロ">S</button></div>`;
    r.addEventListener('click', e => { if (e.target.closest('button')) return; select(i); });
    r.querySelector('.m').onclick = () => { S.parts[i].mute = !S.parts[i].mute; applyMix(); refreshParts(); save(); };
    r.querySelector('.s').onclick = () => { S.parts[i].solo = !S.parts[i].solo; applyMix(); refreshParts(); save(); };
    box.appendChild(r);
  });
  refreshParts();
}
function refreshParts() {
  const anySolo = S.parts.some(p => p.solo);
  [...$('parts').children].forEach((r, i) => {
    const p = S.parts[i];
    r.classList.toggle('sel', i === sel);
    r.classList.toggle('muted', p.mute || (anySolo && !p.solo));
    r.querySelector('.m').classList.toggle('on', p.mute);
    r.querySelector('.s').classList.toggle('on', p.solo);
    drawMini(i);
  });
}
function drawMini(i) {
  const cv = $('parts').children[i].querySelector('canvas');
  const w = cv.clientWidth, h = cv.clientHeight, dpr = devicePixelRatio || 1;
  if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const n = S.steps, cw = w / n, rows = rowsOf(i);
  for (let s = 0; s < n; s++) { g.fillStyle = s === curStep ? 'rgba(63,143,152,.22)' : (Math.floor(s / 4) % 2 ? '#efece4' : '#f6f4ee'); g.fillRect(s * cw, 0, cw - .5, h); }
  g.fillStyle = partColor(i);
  for (const nt of S.parts[i].notes) {
    if (nt.s >= n) continue;
    const y = rows.indexOf(nt.k) / 16 * h;
    g.fillRect(nt.s * cw + .5, y, Math.min(nt.l, n - nt.s) * cw - 1, Math.max(1.5, h / 16));
  }
}

function select(i) {
  sel = i;
  document.documentElement.style.setProperty('--pc', partColor(i));
  $('pttl').textContent = `P${i + 1}  ${PARTS[i].name} / ${PARTS[i].ja}`;
  $('kitBox').style.display = i === 0 ? '' : 'none';
  $('octBox').style.display = i === 0 ? 'none' : '';
  $('octV').textContent = (S.parts[i].oct > 0 ? '+' : '') + S.parts[i].oct;
  $('pvol').value = S.parts[i].vol;
  $('hint').innerHTML = i === 0
    ? '<b>マスをタップ</b>で打つ／消す。<b>なぞる</b>と続けて塗れます。左の名前を押すと試し打ち。行は本体と同じく列（キック/スネア/ハット/パーカッション）ごとにまとめています。'
    : '<b>マスをタップ</b>で音を置く／消す。置いたまま<b>右へドラッグ</b>すると長い音になります（既にある音を横に引くと長さを直せます）。左の音名を押すと試し弾き。16行は本体の16鍵（白鍵）と同じ音です。'
      + (PARTS[i].name === 'CHORD' ? ' わおんは<b>置いた音から白鍵で3つ重ねた和音</b>で鳴ります。' : '');
  buildGrid(); refreshParts();
}

function buildGrid() {
  const p = sel, rows = rowsOf(p), n = S.steps;
  $('gin').style.setProperty('--steps', n);
  const lab = $('labels'); lab.innerHTML = '';
  rows.forEach((k, r) => {
    const d = document.createElement('div');
    if (p === 0) {
      const note = KIT_NOTES[S.kit][k], col = k % 4;
      d.innerHTML = `<i style="background:hsl(${COL_HUE[col]},60%,50%)"></i>${GM[note] || note}`;
      d.title = `${COL_NAMES[col]} / 鍵 ${k + 1} / GM ${note}`;
      if (r % 4 === 0) d.style.borderTop = '1px solid var(--line)';
    } else {
      const m = partPitch(p, k); d.textContent = noteName(m);
      if (m % 12 === 0) { d.classList.add('w'); d.style.borderTop = '1px solid var(--line)'; }
    }
    d.onpointerdown = e => { e.preventDefault(); preview(p, k); };
    lab.appendChild(d);
  });
  drawGrid();
}
let cells = [];
function drawGrid() {
  const g = $('grid'), p = sel, rows = rowsOf(p), n = S.steps;
  g.innerHTML = ''; cells = [];
  for (let r = 0; r < 16; r++) for (let s = 0; s < n; s++) {
    const c = document.createElement('div');
    c.className = 'c' + (s % 4 === 0 ? ' beat' : '') + (Math.floor(s / 4) % 2 ? ' alt' : '') + (s === curStep ? ' ph' : '');
    c.style.gridRow = r + 1; c.style.gridColumn = s + 1;
    if (p === 0 && r % 4 === 0 && r) c.style.borderTopColor = 'var(--line)';
    g.appendChild(c); (cells[s] = cells[s] || []).push(c);
  }
  for (const nt of S.parts[p].notes) {
    if (nt.s >= n) continue;
    const e = document.createElement('div'); e.className = 'n';
    e.style.gridRow = rows.indexOf(nt.k) + 1;
    e.style.gridColumn = `${nt.s + 1} / span ${Math.min(nt.l, n - nt.s)}`;
    e.dataset.s = nt.s; e.dataset.l = sel === 0 ? 1 : nt.l;
    if (p === 0) e.style.background = `hsl(${COL_HUE[nt.k % 4]},55%,52%)`;
    g.appendChild(e);
  }
  if (playing) markHits();
}
function drawHead() {
  for (let s = 0; s < cells.length; s++) if (cells[s]) for (const c of cells[s]) c.classList.toggle('ph', s === curStep);
  markHits();
  S.parts.forEach((_, i) => drawMini(i));
}
function markHits() {
  for (const e of $('grid').querySelectorAll('.n')) {
    const s = +e.dataset.s;
    e.classList.toggle('hit', curStep >= s && curStep < s + +e.dataset.l);
  }
}
function tick() {
  if (playing && ac) {
    let st = curStep;
    while (queue.length && queue[0].time <= ac.currentTime) st = queue.shift().step;
    if (st !== curStep) { curStep = st; drawHead(); }
  }
  requestAnimationFrame(tick);
}

/* ---- グリッドの操作 ---- */
let drag = null;
function cellAt(e) {
  const g = $('grid'), b = g.getBoundingClientRect();
  const s = clamp(Math.floor((e.clientX - b.left) / b.width * S.steps), 0, S.steps - 1);
  const r = clamp(Math.floor((e.clientY - b.top) / b.height * 16), 0, 15);
  return { s, r, k: rowsOf(sel)[r] };
}
$('grid').addEventListener('pointerdown', e => {
  audio();
  const { s, k } = cellAt(e), notes = S.parts[sel].notes;
  $('grid').setPointerCapture(e.pointerId);
  if (sel === 0) {
    const i = notes.findIndex(n => n.s === s && n.k === k);
    const paint = i < 0;
    if (paint) { notes.push({ s, k, l: 1 }); preview(0, k); } else notes.splice(i, 1);
    drag = { drum: true, paint, k, last: s };
  } else {
    const hit = notes.find(n => n.k === k && s >= n.s && s < n.s + n.l);
    if (hit) drag = { note: hit, from: s, moved: false, existed: true };
    else {
      // 同じ行でこの先にある音にぶつからない長さまで
      const nt = { s, k, l: 1 }; notes.push(nt); preview(sel, k);
      drag = { note: nt, from: s, moved: true, existed: false };
    }
  }
  drawGrid(); drawMini(sel);
});
$('grid').addEventListener('pointermove', e => {
  if (!drag) return;
  const { s } = cellAt(e), notes = S.parts[sel].notes;
  if (drag.drum) {
    if (s === drag.last) return; drag.last = s;
    const i = notes.findIndex(n => n.s === s && n.k === drag.k);
    if (drag.paint && i < 0) { notes.push({ s, k: drag.k, l: 1 }); preview(0, drag.k); }
    if (!drag.paint && i >= 0) notes.splice(i, 1);
  } else {
    const nt = drag.note;
    if (s === drag.from && !drag.moved) return;
    drag.moved = true;
    let l = Math.max(1, s - nt.s + 1);
    const nextOn = notes.filter(n => n !== nt && n.k === nt.k && n.s > nt.s).reduce((m, n) => Math.min(m, n.s), S.steps);
    l = Math.min(l, nextOn - nt.s);
    if (l === nt.l) return; nt.l = l;
  }
  drawGrid(); drawMini(sel);
});
function endDrag() {
  if (!drag) return;
  if (!drag.drum && drag.existed && !drag.moved) {
    const notes = S.parts[sel].notes; notes.splice(notes.indexOf(drag.note), 1);
    drawGrid(); drawMini(sel);
  }
  drag = null; save();
}
$('grid').addEventListener('pointerup', endDrag);
$('grid').addEventListener('pointercancel', endDrag);

/* ---- ヘッダ・パート設定 ---- */
function syncHeader() {
  $('bpm').value = S.bpm; $('bpmV').textContent = S.bpm;
  $('swing').value = S.swing; $('swingV').textContent = S.swing + '%';
  $('steps').value = S.steps; $('master').value = S.master; $('kit').value = S.kit;
}
$('play').onclick = () => playing ? stop() : play();
$('bpm').oninput = e => { S.bpm = +e.target.value; $('bpmV').textContent = S.bpm; save(); };
$('swing').oninput = e => { S.swing = +e.target.value; $('swingV').textContent = S.swing + '%'; save(); };
$('master').oninput = e => { S.master = +e.target.value; applyMix(); save(); };
$('steps').onchange = e => {
  S.steps = +e.target.value;
  if (nextStep >= S.steps) nextStep = 0;
  buildGrid(); refreshParts(); save();
};
KIT_NAMES.forEach((n, i) => $('kit').add(new Option(`${i + 1} ${n}`, i)));
$('kit').onchange = e => { S.kit = +e.target.value; buildGrid(); save(); preview(0, 0); };
$('pvol').oninput = e => { S.parts[sel].vol = +e.target.value; applyMix(); save(); };
const setOct = d => { const p = S.parts[sel]; p.oct = clamp(p.oct + d, -2, 2); select(sel); save(); preview(sel, 7); };
$('octDn').onclick = () => setOct(-1); $('octUp').onclick = () => setOct(1);
$('pclear').onclick = () => {
  if (!S.parts[sel].notes.length || !confirm(`P${sel + 1} ${PARTS[sel].name} の音をぜんぶ消しますか？`)) return;
  S.parts[sel].notes = []; drawGrid(); refreshParts(); save();
};
$('clearAll').onclick = () => {
  if (!confirm('7パートぜんぶの音を消しますか？（BPM などの設定は残ります）')) return;
  S.parts.forEach(p => p.notes = []); drawGrid(); refreshParts(); save();
};
$('demo').onclick = () => {
  if (S.parts.some(p => p.notes.length) && !confirm('いまの曲をお手本で上書きしますか？')) return;
  S = demoState(); syncHeader(); applyMix(); select(sel); save();
};
$('exp').onclick = () => {
  const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `ponkey-step-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('imp').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const o = sanitize(JSON.parse(await f.text()));
    if (!o) throw 0;
    S = o; syncHeader(); applyMix(); select(sel); save(); msg('読み込みました');
  } catch (_) { msg('このファイルは STEP の曲として読めませんでした'); }
};
let msgT = 0;
function msg(t) { $('msg').textContent = t; clearTimeout(msgT); msgT = setTimeout(() => $('msg').textContent = '', 4000); }

// キーボード: スペース=再生/停止、1-7=パート選択
addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); playing ? stop() : play(); }
  else if (/^[1-7]$/.test(e.key)) select(+e.key - 1);
});
addEventListener('resize', () => S.parts.forEach((_, i) => drawMini(i)));

syncHeader(); buildParts(); select(0); requestAnimationFrame(tick);
</script>
</body>
</html>
