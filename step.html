<html lang="ja">

<style>
  /* ライト版 (GROOVE と同じ骨格: Inter / 1px細線 / 角なし / 紙のような地) */
  :root{
    --bg:#f4f1ea; --panel:#fbfaf6; --panel2:#efece4; --line:#d9d4c8; --txt:#2a2c30; --dim:#8a8d93;
    --teal:#3f8f98; --red:#b8574b; --pc:#3f8f98;
  }
  *{box-sizing:border-box;border-radius:0}
  body{font-family:'Inter',-apple-system,sans-serif;margin:0;background:var(--bg);color:var(--txt);
       font-size:15px;font-weight:300;letter-spacing:.01em;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
         padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  h1{font-size:19px;margin:0 8px 0 0;font-weight:400;letter-spacing:.1em;white-space:nowrap}
  header .sp{flex:1 1 0}
  a.home{font-size:12px;letter-spacing:.1em;color:var(--dim);text-decoration:none}
  button{font:inherit;font-weight:400;font-size:13px;letter-spacing:.04em;padding:7px 12px;
         border:1px solid var(--line);background:transparent;color:var(--txt);cursor:pointer;white-space:nowrap;touch-action:manipulation}
  button:hover{background:#ebe7dd;border-color:#bfb9ab}
  button:disabled{opacity:.4;cursor:default;background:transparent}
  button.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
  button.primary{border-color:var(--teal);color:var(--teal)}
  button.primary.on{background:var(--teal);color:#fff}
  .pill{font-size:11px;font-weight:500;padding:3px 10px;border:1px solid var(--line);color:var(--dim);letter-spacing:.04em;white-space:nowrap}
  .pill.ok{border-color:var(--teal);color:var(--teal)}
  .pill.ng{border-color:var(--red);color:var(--red)}
  label.f{font-size:11px;color:var(--dim);letter-spacing:.08em;display:flex;align-items:center;gap:6px;white-space:nowrap}
  label.f b{font-weight:500;color:var(--txt);min-width:2.2em;display:inline-block;text-align:center}
  label.f button{padding:4px 9px}
  input[type=range]{accent-color:var(--teal);width:90px}
  main{max-width:980px;margin:0 auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:14px}

  .intro{background:var(--panel);border:1px solid var(--line);padding:16px 18px;font-size:14px;line-height:1.8}
  .intro b{font-weight:500}
  .intro .dim{color:var(--dim);font-size:12.5px}
  .intro .act{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  /* パートの帯: 7本 */
  .parts{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--panel)}
  .prow{display:grid;grid-template-columns:118px 62px 1fr 30px;align-items:center;gap:8px;padding:5px 8px;border-top:1px solid var(--line);cursor:pointer}
  .prow:first-child{border-top:none}
  .prow.sel{background:var(--panel2);box-shadow:inset 3px 0 0 var(--c)}
  .prow .nm{display:flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}
  .prow .nm i{width:10px;height:10px;background:var(--c);flex:none}
  .prow .nm span{color:var(--dim);font-size:11px}
  .prow canvas{width:100%;height:22px;display:block}
  .prow button{padding:3px 0;font-size:11px}
  .prow .mode.step{background:var(--c);border-color:var(--c);color:#fff}
  .prow .m.on{background:var(--red);border-color:var(--red);color:#fff}
  .prow.muted canvas{opacity:.35}

  .pbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .pbar .ttl{font-size:16px;font-weight:400;letter-spacing:.06em;display:flex;align-items:center;gap:8px;margin-right:6px}
  .pbar .ttl i{width:14px;height:14px;background:var(--pc)}
  .pbar .sp{flex:1}
  .lane{font-size:13px}
  .lane b{font-weight:500;color:var(--pc)}

  /* グリッド: 16行 (鍵) × 16ステップ。行をタップ = 本体の16キーで置く音を選ぶ */
  .gwrap{border:1px solid var(--line);background:var(--panel)}
  .gin{display:grid;grid-template-columns:70px 1fr}
  .labels div,.grid .row{height:26px}
  .labels{border-right:1px solid var(--line)}
  .labels div{font-size:10.5px;color:var(--dim);display:flex;align-items:center;gap:5px;padding:0 6px;cursor:pointer;
              border-top:1px solid var(--panel2);white-space:nowrap;overflow:hidden;user-select:none}
  .labels div i{width:6px;height:6px;flex:none}
  .labels div.cur{color:#fff;background:var(--pc)}
  .labels div.cur i{outline:1px solid #fff}
  .grid{display:flex;flex-direction:column;cursor:pointer;user-select:none}
  .grid .row{display:grid;grid-template-columns:repeat(16,1fr);border-top:1px solid var(--panel2)}
  .grid .row.cur{background:color-mix(in srgb,var(--pc) 10%,transparent);outline:1px solid var(--pc);outline-offset:-1px;position:relative;z-index:1}
  .grid .c{border-left:1px solid var(--panel2);position:relative}
  .grid .c.beat{border-left-color:var(--line)}
  .grid .c.ph{background:rgba(63,143,152,.14)}
  .grid .c.on::after{content:'';position:absolute;inset:3px 2px;background:var(--pc)}
  .grid .c.on.ph::after{filter:brightness(1.3);box-shadow:0 0 0 2px rgba(255,255,255,.8) inset}
  .gwrap.pad .grid .row.cur{outline:none;background:none}
  .gwrap.pad .labels div.cur{background:none;color:var(--dim)}

  .hint{font-size:12.5px;color:var(--dim);line-height:1.75}
  .hint b{font-weight:500;color:var(--txt)}
  .foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .foot .sp{flex:1}
  #log{font-size:12px;color:var(--dim)}
  #log.warn{color:var(--red)}
  .off .needconn{opacity:.4;pointer-events:none}
  @media(max-width:560px){
    header{position:static}
    .prow{grid-template-columns:78px 54px 1fr 28px}
    .prow .nm span{display:none}
    .gin{grid-template-columns:58px 1fr}
  }
</style>
</head>
<body class="off">
<header>
  <a class="home" href="index.html">← HOME</a>
  <h1>STEP</h1>
  <button id="conn" class="primary">PONKEY につなぐ</button>
  <span class="pill" id="stat">未接続</span>
  <span class="sp"></span>
  <button id="play" class="primary needconn">▶ 再生</button>
  <label class="f needconn">BPM <button id="bpmDn">−</button><b id="bpmV">—</b><button id="bpmUp">＋</button></label>
  <button id="snd" title="音をアプリから出すか、本体のスピーカーから出すか">音: アプリ</button>
  <label class="f">音量 <input type="range" id="master" min="0" max="100" step="1"></label>
</header>

<main>
  <div class="intro" id="intro">
    <b>PONKEY をステップシーケンサーにするアプリです。</b>
    つなぐと本体の P1〜P7 が <b>STEP</b> に切り替わり、グリッドの16キーがそのパートの <b>16ステップ</b>になります。
    キーを押すとそのステップに音が置かれ（もう一度押すと消える）、再生すると<b>音はこの画面から</b>鳴ります。<br>
    <span class="dim">Chrome（パソコン / Android）で開いてください。iPhone / iPad は Bluefy などの Web Bluetooth 対応ブラウザが必要です。
    要ファーム v4.6.38 以降（PT3 は v5.0.02 以降）。切断すると本体はふだんのパッド演奏に戻ります。</span>
    <div class="act"><button class="primary" id="conn2">PONKEY につなぐ</button></div>
  </div>

  <div class="parts needconn" id="parts"></div>

  <div class="pbar needconn">
    <div class="ttl"><i></i><span id="pttl"></span></div>
    <span class="lane" id="lane"></span>
    <span class="sp"></span>
    <button id="allStep">ぜんぶ STEP</button>
    <button id="allPad">ぜんぶ パッド</button>
    <button id="pclear">このパートを消す</button>
  </div>

  <div class="gwrap needconn" id="gwrap"><div class="gin">
    <div class="labels" id="labels"></div>
    <div class="grid" id="grid"></div>
  </div></div>

  <div class="hint" id="hint"></div>

  <div class="foot">
    <span id="log"></span>
    <span class="sp"></span>
  </div>
</main>

<script>
'use strict';
/* =====================================================================
   PONKEY STEP — 本体の P1〜P7 をステップ入力に切り替え、鳴った音をブラウザで鳴らす
   本体側の窓口 (ファーム v4.6.38+ / PT3 v5.0.02+):
     - SONG_CMD_STEP_PART = pk.stepPart(part, {step, clear, map})
         STEP のパートはグリッド16キー = 16ステップ。押した瞬間に**本体の中で** ON/OFF する。
         各ステップで ON/OFF する「鍵」(P1 = 打楽器 / P2-P7 = 音階表のキー) は map[16] で渡す。
         → このアプリは map を全ステップ同じ鍵にして、「いまどの行を打ち込むか」を画面で選ばせる
     - 本体で ON/OFF した結果は KEY/STEP イベント ('step') で届く。画面はそれを写すだけ
     - 中身の読み出しは DUMP_SLOT → SLOT_DUMP (V2 形式。解釈は TRANCE と同じ)
     - 切断で全パートがパッドへ戻る (ファーム側の鉄則)
   音: CC_SAM_MUTE=127 で本体の内蔵音源を黙らせ、本体が BLE に流す NoteOn/Off
       (ドラム = ch9 の GM ノート / メロディ = 各パートの ch とレイヤー1 の ch、実音高) を WebAudio で鳴らす。
       「音: 本体」にすると CC_SAM_MUTE=0 で本体スピーカーに戻し、ブラウザは黙る。
   ===================================================================== */
const PARTS = Ponkey.PARTS, KIT_NOTES = Ponkey.KIT_NOTES, CCN = Ponkey.CC;
const CC_SAM_MUTE = 0x55;
const KIT_NAMES = ['トイ','オーケストラ','バンド','ゲーム','宇宙','ヘンテコ','ボイス','ワールド'];
const COL_HUE = [0, 130, 220, 320];   // P1 の列 (キック/スネア/ハット/パーカッション)
const STORE = 'ponkey_step_v02';
const DEFAULT_LANE = [0, 12, 12, 12, 12, 12, 12];   // P1 = キック / メロディ = 左下 (いちばん低い音)
const partColor = (p, l = 50) => `hsl(${PARTS[p].hue},62%,${l}%)`;
const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const noteName = m => NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);

const GM = {35:'キック2',36:'キック',37:'リム',38:'スネア',39:'クラップ',40:'スネア2',41:'タム低',42:'ハット',43:'タム低2',
  44:'ペダルHH',45:'タム中',46:'オープンHH',47:'タム中2',48:'タム高',49:'クラッシュ',50:'タム高2',51:'ライド',52:'チャイナ',
  53:'ライドベル',54:'タンバリン',55:'スプラッシュ',56:'カウベル',57:'クラッシュ2',58:'ビブラスラップ',59:'ライド2',
  60:'ボンゴ高',61:'ボンゴ低',62:'コンガM',63:'コンガ高',64:'コンガ低',65:'ティンバレ高',66:'ティンバレ低',67:'アゴゴ高',
  68:'アゴゴ低',69:'カバサ',70:'マラカス',71:'ホイッスル',72:'ロングWh',73:'ギロ',74:'ロングギロ',75:'クラベス',
  76:'ウッド高',77:'ウッド低',78:'クイーカM',79:'クイーカ',80:'トライアングルM',81:'トライアングル'};

/* ---------------- 状態 ---------------- */
// 画面だけの設定 (localStorage)。本体の中身 (grid) は毎回本体から読む
const P = (() => {
  const d = { lane: DEFAULT_LANE.slice(), stepOn: [true, true, true, true, true, true, true], mute: new Array(7).fill(false),
              appSound: true, master: 80 };
  try { const o = JSON.parse(localStorage.getItem(STORE)); if (o) {
    if (Array.isArray(o.lane) && o.lane.length === 7) d.lane = o.lane.map(v => v & 15);
    if (Array.isArray(o.stepOn) && o.stepOn.length === 7) d.stepOn = o.stepOn.map(Boolean);
    if (Array.isArray(o.mute) && o.mute.length === 7) d.mute = o.mute.map(Boolean);
    if (typeof o.appSound === 'boolean') d.appSound = o.appSound;
    if (o.master >= 0 && o.master <= 100) d.master = o.master;
  } } catch (e) {}
  return d;
})();
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(P)); } catch (e) {} };

const D = {                 // 本体の状態 (本体の報告を写す)
  connected: false, version: null,
  grid: Array.from({ length: 7 }, () => Array.from({ length: 16 }, () => new Array(16).fill(false))),  // [part][key][step]
  part: 0,                  // 本体で選ばれているパート (0-6)
  head: -1, playing: false, bpm: null, kit: 0, scale: 0, key: 0,
};
let sel = 0;                // 画面で見ているパート (本体の選択に追従する)
let pk = null;

/* ---------------- 音 (WebAudio) ---------------- */
let ac = null, master, comp, revIn, noiseBuf;
const bus = [];
function audio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return ac; }
  ac = new (window.AudioContext || window.webkitAudioContext)();
  comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = .003; comp.release.value = .2;
  master = ac.createGain();
  comp.connect(master); master.connect(ac.destination);
  const len = ac.sampleRate * 1.8, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  const conv = ac.createConvolver(); conv.buffer = ir;
  revIn = ac.createGain();
  const revOut = ac.createGain(); revOut.gain.value = .35;
  revIn.connect(conv); conv.connect(revOut); revOut.connect(comp);
  noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const PAN = [0, -.15, .25, 0, -.3, .35, .1], SEND = [.08, .12, .2, .02, .35, .45, .3];
  PARTS.forEach((_, i) => {
    const g = ac.createGain(), pan = ac.createStereoPanner ? ac.createStereoPanner() : null, snd = ac.createGain();
    snd.gain.value = SEND[i];
    if (pan) { pan.pan.value = PAN[i]; g.connect(pan); pan.connect(comp); } else g.connect(comp);
    g.connect(snd); snd.connect(revIn);
    bus[i] = g;
  });
  applyMix();
  return ac;
}
const vol01 = v => Math.pow(v / 100, 1.6);
function applyMix() {
  if (!ac) return;
  master.gain.setTargetAtTime(P.appSound ? vol01(P.master) : 0, ac.currentTime, .02);
  P.mute.forEach((m, i) => bus[i].gain.setTargetAtTime(m ? 0 : 1, ac.currentTime, .02));
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function env(g, t, a, peak, d, sus = 0) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(Math.max(sus, 0.0001), t + a + d);
}
function osc(type, f, t, end, out) {
  const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  o.connect(out); o.start(t); o.stop(end); return o;
}
function noise(t, end, out) {
  const n = ac.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
  n.connect(out); n.start(t, Math.random()); n.stop(end); return n;
}
function filt(type, f, q = 1, out) {
  const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; b.connect(out); return b;
}
function gainTo(out, v = 1) { const g = ac.createGain(); g.gain.value = v; g.connect(out); return g; }

/* ---- ドラム: GM ノート番号から合成 (本体は ch9 に GM ノートで流してくる) ---- */
function drum(note, t, vel, out) {
  const v = vel;
  const kick = (f0, f1, dec) => {
    const g = gainTo(out); env(g, t, .002, 1.1 * v, dec);
    const o = osc('sine', f0, t, t + dec + .05, g); o.frequency.exponentialRampToValueAtTime(f1, t + .12);
    const c = gainTo(out); env(c, t, .001, .25 * v, .02); osc('square', 1200, t, t + .03, filt('lowpass', 3000, 1, c));
  };
  const nz = (type, f, q, a, dec, peak, end) => {
    const g = gainTo(out); env(g, t, a, peak * v, dec);
    noise(t, t + (end || dec) + .05, filt(type, f, q, g)); return g;
  };
  const tone = (type, f, dec, peak, f2) => {
    const g = gainTo(out); env(g, t, .002, peak * v, dec);
    const o = osc(type, f, t, t + dec + .05, g);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dec * .8);
    return o;
  };
  const metal = (dec, peak, hp) => {   // 金物: 非整数比の矩形波を束ねる
    const g = gainTo(out); env(g, t, .002, peak * v, dec);
    const f = filt('highpass', hp, 1, g);
    [263, 400, 421, 474, 587, 845].forEach(x => osc('square', x * 1.8, t, t + dec + .05, f));
    nz('highpass', hp + 2000, 1, .002, dec * .7, peak * .6);
  };
  switch (note) {
    case 35: kick(130, 42, .5); break;
    case 36: kick(160, 48, .42); break;
    case 37: tone('triangle', 1700, .03, .6); nz('bandpass', 2500, 4, .001, .025, .5); break;
    case 38: case 40: {
      tone('triangle', note === 38 ? 190 : 230, .12, .55, 140);
      nz('highpass', 1600, .7, .001, note === 38 ? .2 : .14, .75); break;
    }
    case 39: { // クラップ: 3回の破裂 + 尾
      [0, .011, .022].forEach(d => { const g = gainTo(out); env(g, t + d, .001, .8 * v, .012); noise(t + d, t + d + .03, filt('bandpass', 1300, 1.2, g)); });
      const g = gainTo(out); env(g, t + .03, .001, .6 * v, .18); noise(t + .03, t + .25, filt('bandpass', 1200, 1, g)); break;
    }
    case 41: case 43: case 45: case 47: case 48: case 50: {
      const f = 75 + (note - 41) * 16; tone('sine', f * 1.6, .32, .9, f); nz('lowpass', 900, 1, .001, .05, .25); break;
    }
    case 42: nz('highpass', 7500, 1, .001, .045, .45); break;
    case 44: nz('highpass', 6500, 1, .001, .07, .35); break;
    case 46: nz('highpass', 7000, .8, .001, .32, .4); break;
    case 49: case 57: metal(1.4, .22, 5000); break;
    case 52: metal(.9, .25, 3000); break;
    case 55: metal(.55, .22, 6000); break;
    case 51: case 59: metal(.7, .12, 8000); tone('sine', 3200, .5, .06); break;
    case 53: tone('sine', 2400, .6, .25); tone('square', 3600, .2, .05); break;
    case 54: { // タンバリン: シャラッ
      [0, .012, .025].forEach((d, i) => { const g = gainTo(out); env(g, t + d, .001, (.4 - i * .1) * v, .09); noise(t + d, t + d + .12, filt('highpass', 7000, 2, g)); });
      break;
    }
    case 56: { const g = gainTo(out); env(g, t, .001, .35 * v, .28); const f = filt('bandpass', 900, 3, g);
      osc('square', 562, t, t + .32, f); osc('square', 845, t, t + .32, f); break; }
    case 58: { const g = gainTo(out); env(g, t, .002, .5 * v, .7); const am = ac.createGain(); am.gain.value = 0;
      am.connect(g); osc('square', 28, t, t + .8, am.gain); noise(t, t + .8, filt('bandpass', 3000, 3, am)); break; }
    case 60: case 61: case 62: case 63: case 64: case 65: case 66: {
      const F = {60:420,61:310,62:270,63:300,64:200,65:480,66:340}[note];
      tone('sine', F * 1.25, note === 62 ? .08 : .22, .8, F);
      if (note >= 65) tone('triangle', F * 2.1, .15, .2);
      break;
    }
    case 67: case 68: { const f = note === 67 ? 920 : 690; tone('sine', f, .25, .45); tone('sine', f * 2.7, .12, .15); break; }
    case 69: nz('highpass', 5000, 1, .01, .08, .4); break;
    case 70: nz('highpass', 6000, 1, .004, .04, .45); break;
    case 71: case 72: { const d = note === 71 ? .09 : .35; const o = tone('sine', 2300, d, .25);
      const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = 30; lg.gain.value = 60; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + d + .05); break; }
    case 73: case 74: { const n = note === 73 ? 5 : 11;
      for (let i = 0; i < n; i++) { const d = i * .022; const g = gainTo(out); env(g, t + d, .002, .35 * v, .016); noise(t + d, t + d + .025, filt('bandpass', 3200, 5, g)); }
      break; }
    case 75: tone('sine', 2500, .05, .6); break;
    case 76: case 77: tone('sine', note === 76 ? 1250 : 880, .06, .6); tone('square', note === 76 ? 2500 : 1760, .02, .1); break;
    case 78: case 79: { const o = tone('sine', note === 79 ? 420 : 520, .18, .5); o.frequency.linearRampToValueAtTime(note === 79 ? 760 : 380, t + .16); break; }
    case 80: case 81: { const d = note === 80 ? .12 : 1.2; tone('sine', 2600, d, .2); tone('sine', 5200 * 1.01, d * .7, .08); break; }
    default: tone('sine', 300, .15, .5);
  }
}


/* ---- メロディ6パート: NoteOn で鳴らし始め、NoteOff で離す ----
   voice() は最長 MAX_HOLD 秒ぶんの音を組み、gate (ゲイン) を返す。NoteOff で gate を絞って止める。
   NoteOff を取りこぼしても MAX_HOLD で必ず消える。 */
const MAX_HOLD = 4;
const RELEASE = { KEYS: .25, LEAD: .06, BASS: .05, CHORD: .3, BELL: .6, VOICE: .12 };
function voice(p, m, vel, out) {
  const t = ac.currentTime + .005, f = mtof(m), end = t + MAX_HOLD;
  const gate = gainTo(out); gate.gain.setValueAtTime(1, t);
  const stopAll = [];
  const O = (type, fr, dst) => { const o = osc(type, fr, t, end, dst); stopAll.push(o); return o; };
  switch (PARTS[p].name) {
    case 'KEYS': { const g = gainTo(gate); env(g, t, .004, .5 * vel, 1.6);
      const lp = filt('lowpass', 2200 + f, .5, g); O('triangle', f, lp); O('sine', f * 2, gainTo(lp, .25)); break; }
    case 'LEAD': { const g = gainTo(gate); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(.28 * vel, t + .01);
      g.gain.setTargetAtTime(.2 * vel, t + .01, .1);
      const lp = filt('lowpass', 1800, 4, g); lp.frequency.setValueAtTime(5000, t); lp.frequency.exponentialRampToValueAtTime(1600, t + .25);
      const a = O('sawtooth', f, lp), b = O('sawtooth', f, lp); b.detune.value = 9;
      const l = O('sine', 5.5, ac.createGain()), lg = ac.createGain(); l.disconnect(); l.connect(lg);
      lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(7, t + .35); lg.connect(a.detune); lg.connect(b.detune); break; }
    case 'BASS': { const g = gainTo(gate); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(.6 * vel, t + .005);
      g.gain.setTargetAtTime(.42 * vel, t + .005, .12);
      const lp = filt('lowpass', 600, 6, g); lp.frequency.setValueAtTime(2200, t); lp.frequency.exponentialRampToValueAtTime(380, t + .18);
      O('sawtooth', f, lp); O('square', f / 2, gainTo(lp, .5)); break; }
    case 'CHORD': { const g = gainTo(gate); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(.2 * vel, t + .06);
      const lp = filt('lowpass', 2400, .7, g);
      O('sawtooth', f, lp).detune.value = -7; O('triangle', f, lp).detune.value = 7; O('sine', f * 2, gainTo(lp, .2)); break; }
    case 'BELL': { const g = gainTo(gate); env(g, t, .002, .32 * vel, 1.8);
      const car = O('sine', f, g);
      const mod = O('sine', f * 3.5, ac.createGain()), mg = ac.createGain(); mod.disconnect(); mod.connect(mg);
      mg.gain.setValueAtTime(f * 2.2, t); mg.gain.exponentialRampToValueAtTime(f * .1, t + 1); mg.connect(car.frequency); break; }
    case 'VOICE': { const g = gainTo(gate); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(.5 * vel, t + .05);
      const o = O('sawtooth', f, ac.createGain()); o.disconnect();
      [[800, 1, 8], [1150, .5, 9], [2900, .25, 10]].forEach(([F, a, q]) => o.connect(filt('bandpass', F, q, gainTo(g, a))));
      const l = O('sine', 5, ac.createGain()), lg = ac.createGain(); l.disconnect(); l.connect(lg);
      lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(10, t + .4); lg.connect(o.detune); break; }
  }
  const rel = RELEASE[PARTS[p].name];
  return { release() {
    const now = ac.currentTime;
    gate.gain.cancelScheduledValues(now); gate.gain.setValueAtTime(gate.gain.value, now);
    gate.gain.setTargetAtTime(0, now, rel / 3);
    stopAll.forEach(o => { try { o.stop(now + rel * 2 + .05); } catch (e) {} });
  } };
}

// 本体から届いた音
const held = new Map();   // "ch:note" → voice
const chPart = ch => PARTS.findIndex(p => p.ch === ch || p.chL2 === ch);
function onNote(e) {
  if (!P.appSound) return;
  audio();
  const vel = Math.max(.25, (e.vel || 100) / 127);
  if (e.ch === Ponkey.DRUM_CH) {
    if (e.on) { flashPart(0); drum(e.note, ac.currentTime + .003, vel, bus[0]); }
    return;
  }
  const p = chPart(e.ch); if (p < 1) return;
  const id = e.ch + ':' + e.note, old = held.get(id);
  if (old) { old.release(); held.delete(id); }
  if (e.on) { held.set(id, voice(p, e.note, vel, bus[p])); flashPart(p); }
}
function releaseAll() { held.forEach(v => v.release()); held.clear(); }

// 試し鳴らし (ステップを置いたとき・行を選んだとき)。本体が止まっていても音で確かめられる
function preview(p, k) {
  if (!P.appSound) return;
  audio();
  if (p === 0) drum(KIT_NOTES[D.kit][k], ac.currentTime + .005, 1, bus[0]);
  else { const v = voice(p, pitchOf(p, k), .9, bus[p]); setTimeout(() => v.release(), 220); }
}
// 鍵 → 音高の目安 (白鍵・キー C のとき本体と一致。スケール/キーを変えているときは行の名前を鍵番号にする)
const plainScale = () => (D.scale === 0 || D.scale === 0x7f) && D.key === 0;
function pitchOf(p, k) { return PARTS[p].table[k] + PARTS[p].shift; }

/* ---------------- 本体とのやりとり ---------------- */
function fwAtLeast(ver, want) {
  const a = String(ver || '').split('.').map(n => parseInt(n, 10) || 0), b = want.split('.').map(Number);
  for (let i = 0; i < 3; i++) if ((a[i] || 0) !== b[i]) return (a[i] || 0) > b[i];
  return true;
}
function stepSupported() {
  if (!pk || !pk.dbgCmdChar) return false;
  if (pk.hasFeature('STEP_PART')) return true;
  const v = pk.caps.version;
  return !v || fwAtLeast(v, '4.6.38');   // 版が分からないときは送る (古いファームは知らない命令を無視するだけ)
}
const mapOf = p => new Array(16).fill(P.lane[p] & 15);
async function sendStep(p) {
  if (!D.connected) return;
  try { await pk.stepPart(p, { step: P.stepOn[p], map: mapOf(p) }); }
  catch (e) { log(`P${p + 1} の切り替えに失敗: ${e.message}`, true); }
}
async function sendSound() {
  if (!D.connected) return;
  try { await pk.sendCC(CC_SAM_MUTE, P.appSound ? 127 : 0); } catch (e) {}
}

async function connect() {
  if (!navigator.bluetooth) { log('このブラウザは Web Bluetooth が使えません。Chrome（パソコン / Android）か、iPhone なら Bluefy で開いてください', true); return; }
  if (D.connected) { pk.disconnect(); return; }
  audio();
  pk = new Ponkey();
  pk.on('caps', c => { D.version = c.version || D.version; refreshStat(); });
  pk.on('note', onNote);
  pk.on('cc', onCC);
  pk.on('step', onStep);
  pk.on('modeui', m => { if (m.currentMode < 7) followPart(m.currentMode); });
  pk.on('partdown', e => { if (e.key < 7) followPart(e.key); });
  pk.on('slotdump', onSlotDump);
  pk.on('disconnect', onDisconnect);
  try {
    setStat('接続中…');
    await pk.connect({ debug: true, keyEvents: true });
  } catch (e) {
    pk = null; setStat('未接続');
    if (e && e.name !== 'NotFoundError') log('つなげませんでした: ' + (e.message || e), true);
    return;
  }
  if (!pk.dbgCmdChar) { log('STEP の通り道 (デバッグサービス) が見つかりません。本体を再起動してもう一度つないでください', true); }
  D.connected = true; document.body.classList.remove('off');
  $('intro').style.display = 'none';
  $('conn').textContent = '切断'; $('conn2').textContent = '切断';
  refreshStat();
  // 版番号 (CAPS) が届くのを少し待ってから切り替える
  for (let i = 0; i < 15 && !pk.caps.version && !pk.hasFeature('STEP_PART'); i++) await new Promise(r => setTimeout(r, 100));
  refreshStat();
  if (!stepSupported()) {
    log(`この本体のファーム (${pk.caps.version}) は STEP 切り替えに対応していません。v4.6.38 以降（PT3 は v5.0.02 以降）に更新してください`, true);
  }
  await sendSound();
  for (let p = 0; p < 7; p++) await sendStep(p);
  requestDump();
  try { await pk.sendCC(sel, 127); } catch (e) {}   // 画面で見ているパートを本体でも選ぶ
  log('本体を STEP にしました。本体のキーを押すとステップが置かれます');
  render();
}
function onDisconnect() {
  D.connected = false; D.playing = false; D.head = -1; releaseAll();
  document.body.classList.add('off');
  $('intro').style.display = '';
  $('conn').textContent = 'PONKEY につなぐ'; $('conn2').textContent = 'PONKEY につなぐ';
  setStat('未接続', 'ng'); log('切断しました。本体はパッド演奏に戻っています');
  render();
}

function onCC(e) {
  if (e.ch !== 0) return;
  switch (e.cc) {
    case CCN.BAR_SYNC: D.head = e.val & 15; if (!D.playing) { D.playing = true; refreshPlay(); } lastSync = performance.now(); drawHead(); break;
    case CCN.PLAY_STOP: D.playing = e.val > 0; if (!D.playing) { D.head = -1; releaseAll(); drawHead(); } refreshPlay(); break;
    case CCN.BPM: D.bpm = e.val + 60; $('bpmV').textContent = D.bpm; break;
    case CCN.VOICE_SELECT: if (((e.val >> 4) & 15) === 0) { D.kit = e.val & 7; if (sel === 0) render(); } break;
    case CCN.SYNTH_SCALE: D.scale = e.val; if (sel) render(); break;
    case CCN.KEY: D.key = e.val % 12; if (sel) render(); break;
    default: if (e.cc < 7 && e.val > 0) followPart(e.cc);   // 本体でパートキーを押した (CC 通知)
  }
}
// CC_PLAY_STOP が来ない古いファームでも、再生位置が止まったら停止とみなす
let lastSync = 0;
setInterval(() => {
  if (D.playing && performance.now() - lastSync > 1500) { D.playing = false; D.head = -1; drawHead(); refreshPlay(); }
}, 500);

function onStep(e) {
  if (e.part > 6 || e.step > 15) return;
  const k = P.lane[e.part];
  D.grid[e.part][k][e.step] = e.on;
  if (e.on && !D.playing) preview(e.part, k);
  followPart(e.part);
  drawGrid(); drawMini(e.part);
}

// 本体のいまの中身を読む (V2: [0xF2][slot][loopLen][oct×6][rectRow][rectCol][dCnt]{(p<<4)|step,maskLo,maskHi}[sCnt]{(part<<4)|key,sub,raw})
let dumpAsm = {};
function requestDump() {
  dumpAsm = {};
  pk.subscribeCat(Ponkey.DBG_CAT.SONG).catch(() => {});
  pk.dumpSlot(0xff).catch(() => {});
}
function onSlotDump(d) {
  if (d.length < 4) return;
  const gen = d[0], idx = d[1], cnt = d[2];
  let a = dumpAsm[gen];
  if (!a || a.cnt !== cnt) a = dumpAsm[gen] = { cnt, parts: {} };
  a.parts[idx] = d.slice(3);
  if (Object.keys(a.parts).length < cnt) return;
  let tot = 0; for (let c = 0; c < cnt; c++) tot += a.parts[c].length;
  const full = new Uint8Array(tot); let off = 0;
  for (let c = 0; c < cnt; c++) { full.set(a.parts[c], off); off += a.parts[c].length; }
  delete dumpAsm[gen];
  let i = 0;
  if (full[i++] !== 0xF2) return;
  i += 2 + 6 + 2;
  const g = D.grid.map(r => r.map(x => x.fill(false)));
  const dc = full[i++];
  for (let n = 0; n < dc && i + 2 < full.length; n++) {
    const b = full[i++], m = full[i++] | (full[i++] << 8), s = b & 15;
    for (let k = 0; k < 16; k++) if ((m >> k) & 1) g[0][k][s] = true;
  }
  const sc = full[i++];
  for (let n = 0; n < sc && i + 2 < full.length; n++) {
    const pkb = full[i++], sub = full[i++]; i++;
    const pi = (pkb >> 4) & 15, k = pkb & 15;
    if (pi < 6 && (sub & 3) === 0 && (sub >> 2) < 16) g[pi + 1][k][sub >> 2] = true;
  }
  render();
}

/* ---------------- 画面 ---------------- */
const $ = id => document.getElementById(id);
let logT = 0;
function log(t, warn = false) {
  const el = $('log'); el.textContent = t; el.classList.toggle('warn', warn);
  clearTimeout(logT); if (!warn) logT = setTimeout(() => el.textContent = '', 6000);
}
function setStat(t, cls = '') { const s = $('stat'); s.textContent = t; s.className = 'pill ' + cls; }
function refreshStat() { if (D.connected) setStat('接続中' + (D.version ? ' v' + D.version : ''), 'ok'); }
function refreshPlay() { $('play').classList.toggle('on', D.playing); $('play').textContent = D.playing ? '■ 停止' : '▶ 再生'; }
function refreshSnd() { $('snd').textContent = P.appSound ? '音: アプリ' : '音: 本体'; $('snd').classList.toggle('on', !P.appSound); }

function followPart(p) { if (p !== sel) { sel = p; render(); } }

// 表示の上から順の鍵番号。P1 は列 (系統) ごと、メロディは高い音が上
function rowsOf(p) {
  if (p === 0) { const r = []; for (let c = 0; c < 4; c++) for (let row = 0; row < 4; row++) r.push(row * 4 + c); return r; }
  return Array.from({ length: 16 }, (_, k) => k).sort((a, b) => PARTS[p].table[b] - PARTS[p].table[a]);
}
function laneName(p, k) {
  if (p === 0) { const n = KIT_NOTES[D.kit][k]; return GM[n] || ('GM ' + n); }
  return plainScale() ? noteName(pitchOf(p, k)) : `鍵 ${k + 1}`;
}

function buildParts() {
  const box = $('parts'); box.innerHTML = '';
  PARTS.forEach((pt, i) => {
    const r = document.createElement('div'); r.className = 'prow'; r.style.setProperty('--c', partColor(i));
    r.innerHTML = `<div class="nm"><i></i>P${i + 1} ${pt.name}<span>${pt.ja}</span></div>
      <button class="mode" title="本体のこのパートを STEP / パッド に切り替える"></button><canvas></canvas>
      <button class="m" title="アプリの音だけミュート">M</button>`;
    r.addEventListener('click', e => { if (e.target.closest('button')) return; pickPart(i); });
    r.querySelector('.mode').onclick = () => { P.stepOn[i] = !P.stepOn[i]; save(); sendStep(i); render(); };
    r.querySelector('.m').onclick = () => { P.mute[i] = !P.mute[i]; save(); applyMix(); render(); };
    box.appendChild(r);
  });
}
function pickPart(i) {
  sel = i; render();
  if (D.connected) pk.sendCC(i, 127).catch(() => {});   // 本体の P キーを押したのと同じ
}
function refreshParts() {
  [...$('parts').children].forEach((r, i) => {
    r.classList.toggle('sel', i === sel);
    r.classList.toggle('muted', P.mute[i]);
    const b = r.querySelector('.mode'); b.textContent = P.stepOn[i] ? 'STEP' : 'パッド'; b.classList.toggle('step', P.stepOn[i]);
    r.querySelector('.m').classList.toggle('on', P.mute[i]);
    drawMini(i);
  });
}
const flashT = [];
function flashPart(p) {
  const r = $('parts').children[p]; if (!r) return;
  r.querySelector('.nm i').style.boxShadow = '0 0 0 3px ' + partColor(p, 75);
  clearTimeout(flashT[p]); flashT[p] = setTimeout(() => r.querySelector('.nm i').style.boxShadow = '', 90);
}
function drawMini(i) {
  const cv = $('parts').children[i].querySelector('canvas');
  const w = cv.clientWidth, h = cv.clientHeight, dpr = devicePixelRatio || 1;
  if (!w) return;
  if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const cw = w / 16, rows = rowsOf(i), lane = P.lane[i];
  for (let s = 0; s < 16; s++) { g.fillStyle = s === D.head ? 'rgba(63,143,152,.25)' : (Math.floor(s / 4) % 2 ? '#efece4' : '#f6f4ee'); g.fillRect(s * cw, 0, cw - .5, h); }
  rows.forEach((k, r) => {
    g.fillStyle = k === lane && P.stepOn[i] ? partColor(i, 42) : partColor(i, 70);
    for (let s = 0; s < 16; s++) if (D.grid[i][k][s]) g.fillRect(s * cw + .5, r / 16 * h, cw - 1, Math.max(1.5, h / 16));
  });
}

function render() {
  document.documentElement.style.setProperty('--pc', partColor(sel));
  const st = P.stepOn[sel];
  $('pttl').textContent = `P${sel + 1}  ${PARTS[sel].name} / ${PARTS[sel].ja}`;
  $('lane').innerHTML = st
    ? `本体の16キーで置く音: <b>${laneName(sel, P.lane[sel])}</b>`
    : 'このパートは<b>パッド</b>（本体のキー = ふつうの演奏）';
  $('gwrap').classList.toggle('pad', !st);
  $('hint').innerHTML = st
    ? '<b>本体のキー = ステップ</b>（左上が1歩目、右下が16歩目）。押すとこの画面で選んだ行の音が置かれ、もう一度押すと消えます。'
      + '<br><b>行をタップ</b>すると、本体で置く音を切り替えられます（本体の光もその行の16ステップに変わります）。'
      + (sel === 0 ? ` 打楽器はいまのキット（${KIT_NAMES[D.kit]}）の16音です。` : '')
      + (sel && !plainScale() ? ' スケールかキーを変えているので、行は鍵番号で表示しています。' : '')
    : '<b>パッド</b>のパートは本体でふだんどおり弾けます（長押しで録音）。上の <b>STEP</b> を押すとステップ入力に戻ります。';
  buildLabels(); drawGrid(); refreshParts(); refreshPlay(); refreshSnd();
}
function buildLabels() {
  const p = sel, lab = $('labels'); lab.innerHTML = '';
  rowsOf(p).forEach((k, r) => {
    const d = document.createElement('div');
    const col = p === 0 ? `hsl(${COL_HUE[k % 4]},60%,50%)` : partColor(p);
    d.innerHTML = `<i style="background:${col}"></i>${laneName(p, k)}`;
    if (k === P.lane[p]) d.classList.add('cur');
    if (p === 0 && r % 4 === 0 && r) d.style.borderTop = '1px solid var(--line)';
    d.onclick = () => pickLane(k);
    lab.appendChild(d);
  });
}
function drawGrid() {
  const p = sel, g = $('grid'); g.innerHTML = '';
  rowsOf(p).forEach((k, r) => {
    const row = document.createElement('div'); row.className = 'row' + (k === P.lane[p] ? ' cur' : '');
    if (p === 0 && r % 4 === 0 && r) row.style.borderTopColor = 'var(--line)';
    for (let s = 0; s < 16; s++) {
      const c = document.createElement('div');
      c.className = 'c' + (s % 4 === 0 ? ' beat' : '') + (s === D.head ? ' ph' : '') + (D.grid[p][k][s] ? ' on' : '');
      row.appendChild(c);
    }
    row.onclick = () => pickLane(k);
    g.appendChild(row);
  });
}
function pickLane(k) {
  P.lane[sel] = k; save(); preview(sel, k);
  if (P.stepOn[sel]) sendStep(sel);
  render();
}
function drawHead() {
  const rows = $('grid').children;
  for (const row of rows) [...row.children].forEach((c, s) => c.classList.toggle('ph', s === D.head));
  for (let i = 0; i < 7; i++) drawMini(i);
}

/* ---- ヘッダ ---- */
$('conn').onclick = connect; $('conn2').onclick = connect;
$('play').onclick = () => { if (D.connected) { audio(); pk.sendCC(CCN.PLAY_STOP, D.playing ? 0 : 127).catch(() => {}); } };
const bump = d => {
  if (!D.connected || D.bpm == null) return;
  D.bpm = Math.max(60, Math.min(187, D.bpm + d)); $('bpmV').textContent = D.bpm;
  pk.sendCC(CCN.BPM, D.bpm - 60).catch(() => {});
};
$('bpmDn').onclick = () => bump(-5); $('bpmUp').onclick = () => bump(5);
$('snd').onclick = () => { P.appSound = !P.appSound; save(); applyMix(); if (!P.appSound) releaseAll(); sendSound(); refreshSnd(); };
$('master').value = P.master;
$('master').oninput = e => { P.master = +e.target.value; save(); applyMix(); };
$('allStep').onclick = async () => { P.stepOn.fill(true); save(); render(); for (let p = 0; p < 7; p++) await sendStep(p); };
$('allPad').onclick = async () => { P.stepOn.fill(false); save(); render(); for (let p = 0; p < 7; p++) await sendStep(p); };
$('pclear').onclick = async () => {
  if (!D.connected || !confirm(`本体の P${sel + 1} ${PARTS[sel].name} の中身をぜんぶ消しますか？（いまのスロット・全小節）`)) return;
  try { await pk.stepPart(sel, { step: P.stepOn[sel], clear: true, map: mapOf(sel) }); } catch (e) { log('消せませんでした: ' + e.message, true); return; }
  D.grid[sel].forEach(r => r.fill(false)); render();
};
addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  else if (/^[1-7]$/.test(e.key)) pickPart(+e.key - 1);
});
addEventListener('resize', () => { for (let i = 0; i < 7; i++) drawMini(i); });
// iOS などは最初のタップまで音が出せないので、どこかを触ったら起こしておく
addEventListener('pointerdown', () => audio(), { once: true });

buildParts(); render();
</script>
</body>
</html>
