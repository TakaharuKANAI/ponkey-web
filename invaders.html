<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>STEP INVADERS</title>
<meta name="theme-color" content="#07080a">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="STEP INVADERS">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script>if('serviceWorker'in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  /* ===== 8bit アーケード (ダーク)。ライトな他アプリとは意図的に別世界。 ===== */
  :root{
    --bg:#07080a; --panel:#0e1014; --cell:#12151a; --line:#242a33; --txt:#d8dde3; --dim:#5d6570;
    --teal:#5ad6c8; --green:#7fd15a; --orange:#f0912e; --red:#e8503f; --yellow:#f2d43c;
  }
  *{box-sizing:border-box;border-radius:0}
  body{font-family:'Press Start 2P',ui-monospace,monospace;margin:0 auto;color:var(--txt);background:var(--bg);
    max-width:1000px;padding:14px 16px 24px;overscroll-behavior:none;
    image-rendering:pixelated;-webkit-font-smoothing:none}
  /* CRT スキャンライン */
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.26) 0 1px,transparent 1px 3px)}
  h1{font-size:15px;font-weight:400;letter-spacing:.06em;margin:0;color:var(--teal);
     text-shadow:0 0 8px rgba(90,214,200,.45)}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  header .back{font-size:12px;color:var(--dim);text-decoration:none}
  header .back:hover{color:var(--teal)}
  button{font-family:inherit;font-size:9px;letter-spacing:.04em;padding:9px 12px;line-height:1.4;
    border:2px solid var(--line);background:transparent;color:var(--txt);cursor:pointer}
  button:hover{border-color:var(--teal);color:var(--teal)}
  button.primary{border-color:var(--teal);color:var(--teal)}
  button.primary:hover{background:var(--teal);color:var(--bg)}
  button.on{background:var(--teal);border-color:var(--teal);color:var(--bg)}
  .pbadge{display:inline-block;border:2px solid var(--green);color:var(--green);
    font-size:9px;padding:6px 8px;user-select:none;margin-right:5px}
  .pbadge .x{cursor:pointer;color:var(--dim);margin-left:6px}
  .pbadge .x:hover{color:var(--red)}
  .noplayers{font-size:8.5px;color:var(--dim);line-height:1.6}
  /* ===== 筐体レイアウト: 左=4x4スクリーン / 右=HUD ===== */
  .cab{display:flex;gap:20px;align-items:flex-start}
  .screen{border:3px solid var(--line);background:#04050700;padding:7px;box-shadow:0 0 0 1px #000, inset 0 0 40px rgba(90,214,200,.05)}
  #board{position:relative;aspect-ratio:1;height:min(60vh,330px);flex:none;
    display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:4px;
    background:#000;touch-action:manipulation}
  .cell{position:relative;border:1px solid #1b2027;background:var(--cell);cursor:pointer;
    display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
  .cell .kn{position:absolute;bottom:3px;right:4px;font-size:6px;color:#333a44}
  .cell svg{width:66%;height:66%;display:block;shape-rendering:crispEdges}
  .cell.flash{background:var(--teal);box-shadow:0 0 12px var(--teal)}
  .cell.bad{background:#3a1512}
  #board.pulse{box-shadow:0 0 0 2px var(--teal)}
  /* HUD (アーケードのスコアパネル) */
  .hud{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0;padding-top:2px}
  .hrow{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
  .stat .k{font-size:8px;color:var(--dim);letter-spacing:.1em;display:block;margin-bottom:6px}
  .stat .v{font-size:17px;color:var(--teal);line-height:1}
  .stat .v.sm{font-size:11px;color:var(--txt)}
  #lives svg{width:17px;height:12px;margin-right:4px;vertical-align:middle}
  #combo{font-size:11px;color:var(--orange);min-height:12px;letter-spacing:.06em}
  #msg{font-size:9px;color:var(--dim);line-height:1.9;min-height:32px}
  #msg .groove{color:var(--yellow)}
  #msg .miss{color:var(--red)}
  .ctrl{display:flex;gap:8px;flex-wrap:wrap}
  .blink{animation:bl 1s steps(2) infinite}
  @keyframes bl{50%{opacity:.25}}
  /* GAME OVER オーバーレイ */
  #over{position:absolute;inset:0;background:rgba(0,0,0,.9);display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5;text-align:center;padding:12px}
  #over.show{display:flex}
  #over .t{font-size:13px;color:var(--red);letter-spacing:.1em}
  #over .s{font-size:26px;color:var(--yellow)}
  #over .b{font-size:8px;color:var(--dim);line-height:1.8}
  #rotate{display:none;font-size:8px;color:var(--orange);margin:0 0 10px;line-height:1.8}
  /* 縦持ち: 横スクロールを出さないよう筐体を縦積みにする (推奨は横持ち) */
  @media (orientation:portrait){
    #rotate{display:block}
    .cab{flex-direction:column;align-items:center}
    #board{height:min(46vh,320px)}
    .hud{width:100%}
  }
  .console{height:66px;overflow:auto;background:#000;border:2px solid var(--line);padding:8px;
    font-size:8px;line-height:2;color:var(--green)}
  h2{font-size:8px;color:var(--dim);letter-spacing:.14em;margin:0 0 8px}
</style>
</head>
<body>
  <header>
    <a class="back" href="index.html">‹</a>
    <h1>STEP INVADERS</h1>
    <span style="flex:1"></span>
    <span id="players" class="noplayers">未接続</span>
    <button class="primary" id="btnConnect">＋ CONNECT</button>
  </header>
  <div id="rotate">▶ 横向きでプレイしてください</div>

  <div class="cab">
    <div class="screen">
      <div id="board"><div id="over">
        <span class="t blink">GAME OVER</span>
        <span class="s" id="finalScore">0</span>
        <span class="b" id="finalBest"></span>
        <button class="primary" id="btnRetry">RETRY</button>
      </div></div>
    </div>

    <div class="hud">
      <div class="hrow">
        <span class="stat"><span class="k">SCORE</span><span class="v" id="score">000000</span></span>
        <span class="stat"><span class="k">HI</span><span class="v sm" id="best">000000</span></span>
      </div>
      <div class="hrow">
        <span class="stat"><span class="k">LEVEL</span><span class="v sm" id="level">1</span></span>
        <span class="stat"><span class="k">BPM</span><span class="v sm" id="bpmv">---</span></span>
        <span class="stat"><span class="k">SHIPS</span><span class="v sm" id="lives"></span></span>
      </div>
      <div id="combo"></div>
      <div id="msg">グリッドに出るインベーダーを、同じ位置の鍵で撃つ。<br>拍ピッタリで撃つと GROOVE ×2。</div>
      <div class="ctrl">
        <button class="primary" id="btnStart">▶ START</button>
        <button id="btnMetro">♩ CLICK</button>
      </div>
    </div>
  </div>

  <div style="margin-top:40vh">
    <h2>CONSOLE</h2>
    <div class="console" id="log"></div>
  </div>

<script>
// ============================================================ 定数 (ファーム PT2 v4.5.x 一致 — FW変更なしで動く)
const MIDI_SERVICE="03b80e5a-ede8-4b33-a751-6ce34ec4c700", MIDI_CHAR="7772e5db-3868-4112-a1a9-f2669d106bf3";
const CC_PLAY_STOP=0x40, CC_BPM=0x41, CC_BAR_SYNC=0x54;
// シンセパートの音階テーブル (グリッド左下=低音)。音高 → 鍵番号 (0-15) の逆引きに使う
const NOTE_TABLE_BASS  =[45,47,48,50, 38,40,41,43, 31,33,35,36, 24,26,28,29];
const NOTE_TABLE_NORMAL=[69,71,72,74, 62,64,65,67, 55,57,59,60, 48,50,52,53];
function buildReverse(t){const m=new Map();t.forEach((n,i)=>{if(!m.has(n))m.set(n,i)});return m;}
const PART_BY_CHANNEL={0:buildReverse(NOTE_TABLE_BASS),3:buildReverse(NOTE_TABLE_NORMAL),4:buildReverse(NOTE_TABLE_NORMAL)};
// オクターブシフト中でも当てられるよう ±12 半音まで探す (TRANCE と同じ方式)
function lookupKey(ch,note){const rev=PART_BY_CHANNEL[ch];if(!rev)return null;
  if(rev.has(note))return rev.get(note);
  for(let d=1;d<=12;d++){if(rev.has(note-d))return rev.get(note-d);if(rev.has(note+d))return rev.get(note+d);}
  return null;}

// ============================================================ 状態
let devices=[];                    // {device,midiCh,name} devices[0]=P1
let bpm=120, ccBpm=null, stepMs=null, lastStepAt=0, prevStep=null;
let playing=false, score=0, lives=3, kills=0, combo=0, level=1;
let cells=[], invaders=new Array(16).fill(null);   // invaders[k]={age}
let beatCount=0, lastBeatAt=0, nextBeat=0, frame=0;
let best=0; try{best=+localStorage.getItem('ponkey_inv_best')||0;}catch(e){}
function log(m){const e=document.getElementById('log');e.innerHTML+=`&gt; ${m}<br>`;e.scrollTop=e.scrollHeight;}
function pad6(n){return String(n).padStart(6,'0');}

// ============================================================ BLE (入力: NoteOn / クロック: CC_BAR_SYNC / BPM: CC_BPM)
function writeMIDI(e,s,d1,d2){const b=Uint8Array.from([0x80,0x80,s,d1,d2]);
  return (e.midiCh.writeValueWithoutResponse?e.midiCh.writeValueWithoutResponse(b):e.midiCh.writeValue(b)).catch(()=>{});}
document.getElementById('btnConnect').onclick=async()=>{ try{
  log('SCANNING...');
  const dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'PONKEY'}],optionalServices:[MIDI_SERVICE]});
  const gatt=await dev.gatt.connect();
  const midiCh=await(await gatt.getPrimaryService(MIDI_SERVICE)).getCharacteristic(MIDI_CHAR);
  const entry={device:dev,midiCh,name:dev.name||'PONKEY'};
  dev.addEventListener('gattserverdisconnected',()=>{devices=devices.filter(x=>x!==entry);renderPlayers();log(entry.name+' DISCONNECTED');});
  await midiCh.startNotifications();
  midiCh.addEventListener('characteristicvaluechanged',ev=>onMidi(entry,ev));
  devices.push(entry); renderPlayers();
  log('P'+devices.length+' READY - '+entry.name);
}catch(e){log('ERROR: '+e);} };
function renderPlayers(){
  const el=document.getElementById('players');
  if(!devices.length){el.className='noplayers';el.innerHTML='NO DEVICE<br>(画面タップでもプレイ可)';return;}
  el.className='';el.innerHTML='';
  devices.forEach((e,i)=>{const b=document.createElement('span');b.className='pbadge';
    b.innerHTML=`P${i+1}<span class="x">✕</span>`;
    b.querySelector('.x').onclick=()=>{try{e.device.gatt.disconnect();}catch(_){}devices=devices.filter(x=>x!==e);renderPlayers();};
    el.appendChild(b);});
}
function onMidi(entry,ev){
  const b=new Uint8Array(ev.target.value.buffer);
  for(let i=0;i+2<b.length;i++){
    const st=b[i];
    if((st&0xF0)===0x90&&b[i+1]<0x80&&b[i+2]>0){          // NoteOn (vel>0) → 鍵番号へ逆引き
      const k=lookupKey(st&0x0F,b[i+1]); if(k!=null)hit(k); i+=2; continue;
    }
    if(entry===devices[0]&&st===0xB0&&b[i+2]<0x80){        // クロック/BPM は P1 に従属
      if(b[i+1]===CC_BAR_SYNC){onStep(b[i+2]);i+=2;}
      else if(b[i+1]===CC_BPM){ccBpm=b[i+2]+60;bpm=ccBpm;setBpmView();i+=2;}
    }
  }
}
function setBpmView(){document.getElementById('bpmv').textContent=Math.round(bpm);}
function onStep(s){
  const now=performance.now();
  if(prevStep!=null&&s<prevStep)onBar();
  prevStep=s;
  if(s%4===0)onBeat(now);
  if(lastStepAt){const dt=now-lastStepAt;
    if(dt>40&&dt<2000){stepMs=stepMs==null?dt:stepMs*.8+dt*.2;
      if(ccBpm==null){bpm=60000/(stepMs*4);setBpmView();}}}
  lastStepAt=now;
}

// ============================================================ ゲームクロック
// P1 が再生中なら本体のステップに同期。そうでなければ内蔵クロック (BPM) で駆動。
const deviceClockActive=()=>performance.now()-lastStepAt<600;
setInterval(()=>{
  if(!playing||deviceClockActive())return;
  const now=performance.now();
  if(now>=nextBeat){onBeat(now);nextBeat=now+60000/bpm;
    if(beatCount%4===0)onBar();}
},25);
function onBeat(now){
  lastBeatAt=now;beatCount++;
  if(metroOn)click(beatCount%4===1);
  frame^=1;                                    // 本家インベーダー同様、拍ごとに2コマで歩く
  for(let k=0;k<16;k++)if(invaders[k])drawCell(k);
  const bd=document.getElementById('board');
  bd.classList.add('pulse');setTimeout(()=>bd.classList.remove('pulse'),90);
  if(playing)spawnTick();
}
function onBar(){ if(!playing)return;
  for(let k=0;k<16;k++){const v=invaders[k];if(!v)continue;
    v.age++;
    if(v.age>=4)escape(k);else drawCell(k);}
}

// ============================================================ ゲーム本体
function spawnTick(){
  const alive=invaders.filter(Boolean).length;
  const cap=Math.min(2+level,8);
  if(alive>=cap)return;
  const p=Math.min(.22+level*.08,.8);
  if(Math.random()>p)return;
  const empty=[];for(let k=0;k<16;k++)if(!invaders[k])empty.push(k);
  if(!empty.length)return;
  const k=empty[Math.floor(Math.random()*empty.length)];
  invaders[k]={age:0};drawCell(k);
}
function hit(k){
  if(!playing)return;
  const c=cells[k];
  if(invaders[k]){
    const now=performance.now(), beatMs=60000/bpm;
    const off=Math.min(now-lastBeatAt,Math.max(0,lastBeatAt+beatMs-now));
    const groove=off<90;
    combo++;kills++;
    const mult=1+Math.floor(combo/8);
    const pts=100*mult*(groove?2:1);
    score+=pts;
    invaders[k]=null;drawCell(k);
    c.classList.add('flash');setTimeout(()=>c.classList.remove('flash'),110);
    zap(groove);
    msg(groove?`<span class="groove">GROOVE!! +${pts}</span>`:`+${pts}`);
    if(kills%10===0){level++;log('LEVEL '+level);}
    updateHud();
  }else{
    combo=0;updateHud();
    c.classList.add('bad');setTimeout(()=>c.classList.remove('bad'),110);
  }
}
function escape(k){
  invaders[k]=null;drawCell(k);
  lives--;combo=0;buzz();updateHud();
  msg('<span class="miss">MISSED!</span>');
  if(lives<=0)gameOver();
}
function start(){
  score=0;lives=3;kills=0;combo=0;level=1;beatCount=0;
  invaders.fill(null);cells.forEach((c,k)=>drawCell(k));
  document.getElementById('over').classList.remove('show');
  document.getElementById('btnStart').classList.remove('blink');
  playing=true;nextBeat=performance.now();
  ensureAudio();updateHud();msg('');
  if(devices[0])writeMIDI(devices[0],0xB0,CC_PLAY_STOP,1);   // 本体のクロックを回す (P1)
  log('GAME START');
}
function gameOver(){
  playing=false;
  if(score>best){best=score;try{localStorage.setItem('ponkey_inv_best',best);}catch(e){}}
  document.getElementById('finalScore').textContent=pad6(score);
  document.getElementById('finalBest').textContent='HI '+pad6(best)+'  /  LEVEL '+level;
  document.getElementById('over').classList.add('show');
  document.getElementById('btnStart').classList.add('blink');
  updateHud();log('GAME OVER - '+pad6(score));
}
const SHIP='<svg viewBox="0 0 11 8" shape-rendering="crispEdges"><g fill="#5ad6c8">'+
  '<rect x="5" y="1" width="1" height="2"/><rect x="4" y="3" width="3" height="1"/>'+
  '<rect x="1" y="4" width="9" height="2"/><rect x="0" y="5" width="11" height="2"/></g></svg>';
function updateHud(){
  document.getElementById('score').textContent=pad6(score);
  document.getElementById('best').textContent=pad6(best);
  document.getElementById('level').textContent=level;
  document.getElementById('combo').textContent=combo>1?combo+' COMBO':'';
  document.getElementById('lives').innerHTML=SHIP.repeat(Math.max(0,lives))||'<span style="color:#5d6570">-</span>';
}
let msgTimer=null;
function msg(h){const e=document.getElementById('msg');e.innerHTML=h;
  clearTimeout(msgTimer);msgTimer=setTimeout(()=>{if(playing)e.innerHTML='';},900);}

// ============================================================ ボード描画
// 本家インベーダーの2コマ・スプライト。残り時間 (age) が進むほど 緑 → 黄 → 橙 → 赤。
const AGE_COLORS=['#7fd15a','#f2d43c','#f0912e','#e8503f'];
const SPR=[
  // frame 0 (腕おろし)
  [[2,0,1,1],[8,0,1,1],[3,1,1,1],[7,1,1,1],[2,2,7,1],
   [1,3,2,1],[4,3,3,1],[8,3,2,1],[0,4,11,1],
   [0,5,1,1],[2,5,7,1],[10,5,1,1],
   [0,6,1,1],[2,6,1,1],[8,6,1,1],[10,6,1,1],[3,7,2,1],[6,7,2,1]],
  // frame 1 (腕あげ)
  [[2,0,1,1],[8,0,1,1],[0,1,1,1],[3,1,1,1],[7,1,1,1],[10,1,1,1],
   [0,2,1,1],[2,2,7,1],[10,2,1,1],
   [0,3,3,1],[4,3,3,1],[8,3,3,1],[0,4,11,1],
   [1,5,9,1],[2,6,1,1],[8,6,1,1],[1,7,1,1],[9,7,1,1]],
];
function invaderSVG(color,f){
  const r=SPR[f].map(([x,y,w,h])=>`<rect x="${x}" y="${y}" width="${w}" height="${h}"/>`).join('');
  return `<svg viewBox="0 0 11 8" shape-rendering="crispEdges"><g fill="${color}">${r}</g></svg>`;
}
function drawCell(k){
  const v=invaders[k];
  cells[k].innerHTML=(v?invaderSVG(AGE_COLORS[Math.min(v.age,3)],frame):'')+`<span class="kn">${k+1}</span>`;
}
const board=document.getElementById('board');
for(let k=0;k<16;k++){
  const c=document.createElement('div');c.className='cell';
  c.addEventListener('pointerdown',()=>hit(k));      // 画面タップでも遊べる (本体なしのフォールバック)
  board.appendChild(c);cells.push(c);drawCell(k);
}

// ============================================================ サウンド (WebAudio)
let audioCtx=null, metroOn=false;
function ensureAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();}
function tone(f0,f1,dur,vol,type){if(!audioCtx)return;const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+dur+.02);}
function zap(groove){tone(groove?1600:1100,180,.12,.4,'square');}
function buzz(){tone(140,60,.3,.4,'sawtooth');}
function click(accent){tone(accent?1760:1320,accent?1760:1320,.05,accent?.4:.28,'square');}
document.getElementById('btnMetro').onclick=function(){
  metroOn=!metroOn;ensureAudio();this.classList.toggle('on',metroOn);};
document.getElementById('btnStart').onclick=start;
document.getElementById('btnRetry').onclick=start;

// ============================================================
setBpmView();updateHud();renderPlayers();
document.getElementById('btnStart').classList.add('blink');
log('READY. CONNECT して P5-P7 の鍵で撃つ');
</script>
</body>
</html>
