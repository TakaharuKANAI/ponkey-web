<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCALE</title>
<meta name="theme-color" content="#f4f1ea">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PONKEY SCALE">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script>if('serviceWorker'in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* 1 画面: ヘッダ / キー(1表示・左右送り) / スケール枠(1表示・左右送り + 4×4) / 鍵盤 / 1行ステータス。
     スマホ縦で収まるように、高さは 100dvh を縦 flex で配り、4×4 だけが残りを吸う */
  :root{
    --bg:#f4f1ea; --panel:#fbfaf6; --panel2:#efece4; --line:#d9d4c8; --txt:#2a2c30; --dim:#8a8d93;
    --teal:#3f8f98; --red:#b8574b; --tint:rgba(63,143,152,.13);
  }
  *{box-sizing:border-box;border-radius:0}
  html,body{height:100%}
  body{font-family:'Inter',-apple-system,sans-serif;margin:0;background:var(--bg);color:var(--txt);
       font-size:14px;font-weight:300;letter-spacing:.01em;-webkit-font-smoothing:antialiased;
       overflow:hidden;overscroll-behavior:none;touch-action:pan-y}
  .app{height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
       padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  header a{font-size:12px;letter-spacing:.1em;color:var(--dim);text-decoration:none;padding:4px 6px 4px 0}
  h1{font-size:17px;margin:0;font-weight:400;letter-spacing:.1em;flex:1}
  button{font:inherit;font-weight:400;font-size:12px;letter-spacing:.04em;padding:6px 11px;
         border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer}
  button.primary{border-color:var(--teal);color:var(--teal)}
  .pill{font-size:10.5px;font-weight:500;padding:3px 8px;border:1px solid var(--line);color:var(--dim);letter-spacing:.04em}
  .pill.ok{border-color:var(--teal);color:var(--teal)}
  .pill.ng{border-color:var(--red);color:var(--red)}
  h2{font-size:10px;color:var(--dim);margin:0;text-transform:uppercase;letter-spacing:.16em;font-weight:500}

  /* ── 左右送りの枠 ── */
  .sel{background:var(--panel);border:1px solid var(--line);user-select:none;-webkit-user-select:none;
       display:flex;flex-direction:column;touch-action:pan-y;outline:none}
  .sel:focus-visible,.sel.hov{border-color:#c2bcae}
  .selrow{display:flex;align-items:center;gap:6px;padding:8px 6px}
  .arrow{flex:0 0 36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;
         color:var(--dim);font-size:18px;border:0;background:transparent;padding:0}
  .arrow:hover{color:var(--teal)}
  .selbody{flex:1;min-width:0;text-align:center}
  .selbody .big{font-size:22px;font-weight:400;letter-spacing:.06em;line-height:1.15}
  .selbody .sub{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dots{display:flex;gap:4px;justify-content:center;padding:0 0 6px}
  .dots i{width:4px;height:4px;background:var(--line);display:block}
  .dots i.on{background:var(--teal)}
  #keySel .selbody .big{font-size:26px}
  #keySel.dim .selbody{opacity:.4}

  /* ── スケール枠の中の 4×4 (残り高さを吸って正方形) ── */
  .gridwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 10px 10px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:6px}
  /* 一辺は JS (fitGrid) が wrap の幅・高さの小さいほうに合わせる */
  .g{border:1px solid #c9c4b7;background:#fff;border-radius:50%;cursor:pointer;display:flex;flex-direction:column;
     align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;position:relative;min-width:0;min-height:0}
  .g.blk{background:#3a3d42;color:#eae7df;border-color:#2a2c30}
  .g .nn{font-size:clamp(11px,4.2vmin,17px);font-weight:400;line-height:1}
  .g .oc{font-size:clamp(7px,2.4vmin,10px);opacity:.6;margin-top:1px}
  .g.root{box-shadow:0 0 0 2px var(--teal)}
  .g.hit{background:var(--tint);border-color:var(--teal)}
  .g.blk.hit{background:#4c6f74}

  /* ── 鍵盤 ── */
  .piano{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);padding:6px 8px 4px}
  .piano svg{display:block;width:100%;height:78px}
  .piano text{font-family:Inter,sans-serif;font-size:9px}
  .status{flex:0 0 auto;font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:14px}
</style>
</head>
<body>
<div class="app">
  <header>
    <a href="index.html" title="アプリ一覧へ">‹</a>
    <h1>SCALE</h1>
    <span id="conn" class="pill ng">未接続</span>
    <button class="primary" id="btnConnect">接続</button>
  </header>

  <!-- ══ キー ══ -->
  <div class="sel" id="keySel" tabindex="0" data-kind="key">
    <div class="selrow">
      <button class="arrow" data-d="-1" aria-label="前のキー">‹</button>
      <div class="selbody"><h2>Key</h2><div class="big" id="keyBig">C</div></div>
      <button class="arrow" data-d="1" aria-label="次のキー">›</button>
    </div>
  </div>

  <!-- ══ スケール + 16 キー ══ -->
  <div class="sel" id="scaleSel" tabindex="0" data-kind="scale" style="flex:1;min-height:0">
    <div class="selrow">
      <button class="arrow" data-d="-1" aria-label="前のスケール">‹</button>
      <div class="selbody"><h2>Scale</h2><div class="big" id="scaleBig"></div><div class="sub" id="scaleSub"></div></div>
      <button class="arrow" data-d="1" aria-label="次のスケール">›</button>
    </div>
    <div class="dots" id="dots"></div>
    <div class="gridwrap"><div class="grid" id="grid"></div></div>
  </div>

  <!-- ══ 鍵盤 ══ -->
  <div class="piano"><svg id="piano"></svg></div>

  <div class="status" id="status"></div>
</div>

<script>
// ════════════════════════════════════════════════ ファーム側の契約 (PT2 v4.5.64+)
//   CC_SYNTH_SCALE 0x37: 0-7 = 音階 (SCALES の順 = ファーム SCALE_DEFS) / 0x7F = 白鍵 (従来)
//   CC_KEY         0x38: 0-11 = C..B (曲のキー。本体 Fn×P4 のキーページと同じ値)
//   どちらも双方向。接続直後の State Sync に含まれるので本体を正として画面を合わせる。
const MIDI_SERVICE="03b80e5a-ede8-4b33-a751-6ce34ec4c700", MIDI_CHAR="7772e5db-3868-4112-a1a9-f2669d106bf3";
const CC_SYNTH_SCALE=0x37, CC_KEY=0x38, SCALE_WHITE=0x7F, ROOT_BASE=48;
const PC=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const IS_BLACK=[0,1,0,1,0,0,1,0,1,0,1,0];
const WHITE=[0,2,4,5,7,9,11];
// 表示順: 白鍵 → ファーム SCALE_DEFS 0-7。id はファームに送る値
const SCALES=[
  {id:SCALE_WHITE, n:'白鍵',            d:'いつもの PONKEY。C3 から白鍵 16 本'},
  {id:0, n:'メジャーペンタ',  iv:[0,2,4,7,9],       d:'素朴であかるい。外れる音がない'},
  {id:1, n:'マイナーペンタ',  iv:[0,3,5,7,10],      d:'かげりのある、外さない'},
  {id:2, n:'琉球',            iv:[0,4,5,7,11],      d:'南の島。ゆったり'},
  {id:3, n:'都節',            iv:[0,1,5,7,8],       d:'和の陰旋法。しっとり'},
  {id:4, n:'メジャー',        iv:[0,2,4,5,7,9,11],  d:'ふつうの長調。7 音'},
  {id:5, n:'ドリアン',        iv:[0,2,3,5,7,9,10],  d:'短調だけど少し明るい'},
  {id:6, n:'ブルース',        iv:[0,3,5,6,7,10],    d:'にごりのある 6 音'},
  {id:7, n:'ホールトーン',    iv:[0,2,4,6,8,10],    d:'全音だけ。浮遊感'},
];
const idxOfId=id=>Math.max(0,SCALES.findIndex(s=>s.id===id));

// ════════════════════════════════════════════════ 状態
const LS='ponkey_scale_v01';
let store={scale:SCALE_WHITE,key:0};
try{ Object.assign(store,JSON.parse(localStorage.getItem(LS)||'{}')); }catch(_){}
function save(){ localStorage.setItem(LS,JSON.stringify({scale:store.scale,key:store.key})); }
let dev,gatt,midiCh,connected=false,gotSync=false;

function keyOfRank(r){ return (3-Math.floor(r/4))*4 + (r%4); }   // 対合
function curScale(){ return SCALES[idxOfId(store.scale)]; }
// LEAD/PAD の音高 (ファーム rebuildSynthNoteTables と同じ算出)
function pitchOfRank(r){
  const s=curScale();
  if(s.id===SCALE_WHITE) return ROOT_BASE + Math.floor(r/7)*12 + WHITE[r%7];
  const L=s.iv.length;
  return Math.min(127, ROOT_BASE + store.key + Math.floor(r/L)*12 + s.iv[r%L]);
}
const noteName=n=>PC[((n%12)+12)%12], octOf=n=>Math.floor(n/12)-1, isBlack=n=>!!IS_BLACK[((n%12)+12)%12];
const rootPc=()=>curScale().id===SCALE_WHITE?0:store.key;

// ════════════════════════════════════════════════ 描画
function render(){
  const s=curScale(), white=s.id===SCALE_WHITE;
  document.getElementById('keyBig').textContent=PC[store.key];
  document.getElementById('keySel').classList.toggle('dim',white);
  document.getElementById('scaleBig').textContent=s.n;
  document.getElementById('scaleSub').textContent= white ? s.d
    : s.iv.map(v=>PC[(store.key+v)%12]).join(' ')+'  ·  '+s.d;
  const dots=document.getElementById('dots');
  if(!dots.children.length) SCALES.forEach(()=>dots.appendChild(document.createElement('i')));
  [...dots.children].forEach((d,i)=>d.classList.toggle('on',i===idxOfId(store.scale)));

  const g=document.getElementById('grid');
  if(!g.children.length){
    for(let k=0;k<16;k++){ const d=document.createElement('div'); d.className='g';
      d.innerHTML='<span class="nn"></span><span class="oc"></span>';
      d.onclick=()=>{ const n=pitchOfRank(keyOfRank(k)); flash(k); previewNote(n,.45,.25); }; g.appendChild(d); }
  }
  for(let k=0;k<16;k++){ const n=pitchOfRank(keyOfRank(k)), d=g.children[k];
    d.querySelector('.nn').textContent=noteName(n); d.querySelector('.oc').textContent=octOf(n);
    d.classList.toggle('blk',isBlack(n)); d.classList.toggle('root',(n%12)===rootPc()); }
  renderPiano();
}

// 鍵盤: 16 キーが叩く音域だけを、C 始まり〜B 終わりで切り出して描く。叩ける鍵に色、根音は濃く
function renderPiano(){
  const svg=document.getElementById('piano'), Wpx=svg.clientWidth||300, H=svg.clientHeight||78;
  const pitches=[]; for(let r=0;r<16;r++) pitches.push(pitchOfRank(r));
  const lo=Math.floor(Math.min(...pitches)/12)*12, hi=Math.floor(Math.max(...pitches)/12)*12+11;
  const set=new Set(pitches);
  const whites=[]; for(let n=lo;n<=hi;n++) if(!isBlack(n)) whites.push(n);
  const W=Wpx/whites.length, out=[];
  svg.setAttribute('viewBox',`0 0 ${Wpx} ${H}`);
  whites.forEach((n,i)=>{ const on=set.has(n), rt=on&&(n%12)===rootPc();
    out.push(`<rect x="${(i*W).toFixed(2)}" y="0" width="${W.toFixed(2)}" height="${H}" fill="${rt?'#3f8f98':on?'#bfe0e3':'#fbfaf6'}" stroke="#c9c4b7" stroke-width="1" data-n="${n}"/>`);
    if(n%12===0) out.push(`<text x="${(i*W+W/2).toFixed(2)}" y="${H-4}" text-anchor="middle" fill="${rt?'#fff':'#8a8d93'}">C${octOf(n)}</text>`);
  });
  whites.forEach((n,i)=>{ const b=n+1; if(b>hi||!isBlack(b)) return; const on=set.has(b), rt=on&&(b%12)===rootPc();
    out.push(`<rect x="${(i*W+W*0.66).toFixed(2)}" y="0" width="${(W*0.68).toFixed(2)}" height="${(H*0.6).toFixed(1)}" fill="${rt?'#3f8f98':on?'#4c8f96':'#2a2c30'}" data-n="${b}"/>`);
  });
  svg.innerHTML=out.join('');
  svg.onclick=e=>{ const n=+e.target.getAttribute('data-n'); if(!isNaN(n)&&set.has(n)){ previewNote(n,.45,.25); flash(keyOfRank(pitches.indexOf(n))); } };
}
// 4×4 を wrap の幅・高さの小さいほうに合わせて正方形にする (円が楕円にならないように)
function fitGrid(){ const w=document.querySelector('.gridwrap'), g=document.getElementById('grid');
  const cs=getComputedStyle(w), side=Math.max(80, Math.min(w.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),
    w.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)));
  g.style.width=g.style.height=side+'px'; }
new ResizeObserver(()=>{ fitGrid(); renderPiano(); }).observe(document.querySelector('.app'));
function flash(k){ const d=document.getElementById('grid').children[k]; if(!d)return; d.classList.add('hit'); setTimeout(()=>d.classList.remove('hit'),170); }
function status(s){ document.getElementById('status').textContent=s; }

// ════════════════════════════════════════════════ 操作 (左右送り / スワイプ / 矢印キー)
function step(kind,d){
  if(kind==='key'){ store.key=(store.key+d+12)%12; save(); render(); sendKey(); if(curScale().id!==SCALE_WHITE) arpeggio(); }
  else { const i=(idxOfId(store.scale)+d+SCALES.length)%SCALES.length; store.scale=SCALES[i].id; save(); render(); sendScale(); arpeggio(); }
}
document.querySelectorAll('.sel').forEach(el=>{
  const kind=el.dataset.kind;
  el.querySelectorAll('.arrow').forEach(b=>b.onclick=e=>{ e.stopPropagation(); step(kind,+b.dataset.d); });
  // スワイプ (タッチ) / ドラッグ (マウス)。縦スクロールは無いので横 40px で確定
  let x0=null,y0=null;
  el.addEventListener('pointerdown',e=>{ if(e.target.closest('.g,.arrow'))return; x0=e.clientX; y0=e.clientY; });
  el.addEventListener('pointerup',e=>{ if(x0===null)return; const dx=e.clientX-x0, dy=e.clientY-y0; x0=null;
    if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)*1.5) step(kind, dx<0?1:-1); });
  el.addEventListener('pointercancel',()=>{x0=null;});
  // PC: カーソルを乗せた枠に矢印キーが効く
  el.addEventListener('mouseenter',()=>{ document.querySelectorAll('.sel').forEach(s=>s.classList.remove('hov')); el.classList.add('hov'); });
  el.addEventListener('mouseleave',()=>el.classList.remove('hov'));
});
addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  const el=document.querySelector('.sel.hov')||document.activeElement.closest?.('.sel')||document.getElementById('scaleSel');
  step(el.dataset.kind, e.key==='ArrowRight'?1:-1); e.preventDefault();
});
// スケールを変えたときの短い上行 (雰囲気が一瞬で分かる)
function arpeggio(){ const c=actx(), t0=c.currentTime;
  for(let r=0;r<8;r++){ const n=pitchOfRank(r); setTimeout(()=>flash(keyOfRank(r)),r*105); previewNote(n,.3,.16,t0+r*.105); } }

// ════════════════════════════════════════════════ 試聴 (WebAudio)。音高の確認用で本体の音ではない
let ac=null;
function actx(){ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended')ac.resume(); return ac; }
function previewNote(midi,dur,gain,at){
  const c=actx(), t=at??c.currentTime, o=c.createOscillator(), g=c.createGain();
  o.type='triangle'; o.frequency.value=440*Math.pow(2,(midi-69)/12);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+.008);
  g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.02);
}

// ════════════════════════════════════════════════ BLE
async function sendScale(){ if(connected){ await writeMIDI(0xB0,CC_SYNTH_SCALE,store.scale); status(`本体へ: ${curScale().n}`); } else status(curScale().n+'（未接続）'); }
async function sendKey(){ if(connected){ await writeMIDI(0xB0,CC_KEY,store.key); status(`本体へ: キー ${PC[store.key]}`); } else status('キー '+PC[store.key]+'（未接続）'); }
document.getElementById('btnConnect').onclick=async()=>{ try{
  status('デバイス選択…');
  dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'PONKEY'}],optionalServices:[MIDI_SERVICE]});
  dev.addEventListener('gattserverdisconnected',()=>{setConn(false);status('切断');});
  gatt=await dev.gatt.connect();
  midiCh=await(await gatt.getPrimaryService(MIDI_SERVICE)).getCharacteristic(MIDI_CHAR);
  await midiCh.startNotifications();
  midiCh.addEventListener('characteristicvaluechanged',onMidi);
  setConn(true); status('接続。本体の設定を待っています…');
  // 本体が正 (電源を切っても残る設定なので、アプリ側の記憶で上書きしない)。State Sync が来なければ古いファーム
  gotSync=false; setTimeout(()=>{ if(connected&&!gotSync) status('⚠ 本体から音階の設定が届きません（ファーム v4.5.64 以降が必要）'); },4000);
}catch(e){ status('接続エラー: '+e); } };
function setConn(c){ connected=c; const el=document.getElementById('conn'); el.textContent=c?'接続済み':'未接続'; el.className='pill '+(c?'ok':'ng'); }
async function writeMIDI(s,d1,d2){ if(!midiCh)return; const u=Uint8Array.from([0x80,0x80,s,d1,d2]);
  try{ await midiCh.writeValueWithoutResponse(u); }catch(e){ try{ await midiCh.writeValue(u); }catch(_){ } } }
function onMidi(e){
  const b=new Uint8Array(e.target.value.buffer);
  for(let i=0;i+2<b.length;i++){
    if(b[i]!==0xB0) continue;
    const cc=b[i+1], v=b[i+2];
    if(cc===CC_SYNTH_SCALE){ store.scale=(v<=7)?v:SCALE_WHITE; save(); render(); status('本体: '+curScale().n); gotSync=true; i+=2; }
    else if(cc===CC_KEY && v<12){ store.key=v; save(); render(); status('本体: キー '+PC[v]); gotSync=true; i+=2; }
  }
}
fitGrid(); render(); status('← → で切り替え。タップで試聴');
</script>
</body>
</html>
