<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<style>
:root {
  --orange:#C4884E; --orange-bright:#F0A060;
  --black:#1A1714; --dark:#2A2420; --mid:#3D3530; --muted:#8A7D75; --cream:#F7F3EE;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Be Vietnam Pro',sans-serif; background:var(--black); color:var(--cream);
  min-height:100vh; padding:16px 16px 40px;
}
.wrap { width:100%; max-width:980px; margin:0 auto; }
button, select { font-family:inherit; }

/* ── Header ── */
.top { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
.home { font-size:14px; color:var(--muted); text-decoration:none; padding:4px 6px; }
.title { font-size:.8rem; font-weight:800; letter-spacing:.16em; color:var(--orange); margin-right:auto; }
.btn {
  padding:8px 14px; border:2px solid var(--mid); border-radius:10px; background:transparent;
  color:var(--cream); font-size:.72rem; font-weight:700; letter-spacing:.06em; cursor:pointer; transition:all .15s;
}
.btn:hover { border-color:var(--orange); color:var(--orange-bright); }
.btn.on { border-color:var(--orange-bright); color:var(--black); background:var(--orange-bright); }
.bpm { display:flex; align-items:center; gap:6px; font-size:.65rem; font-weight:700; color:var(--muted); letter-spacing:.1em; }
.bpm b { color:var(--orange); min-width:28px; text-align:right; }
input[type=range] { -webkit-appearance:none; appearance:none; width:110px; height:3px; background:var(--mid); border-radius:2px; outline:none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:var(--orange); cursor:pointer; }

.banner { display:none; background:rgba(220,60,60,.15); border:1.5px solid rgba(220,60,60,.4); border-radius:10px;
  padding:8px 12px; font-size:.75rem; font-weight:600; color:#f08080; margin-bottom:12px; }
.banner.show { display:block; }
.hint { font-size:.72rem; color:var(--muted); text-align:center; margin:4px 0 14px; min-height:1.2em; }

/* ── Stage: 1 PONKEY = 1 盤面。同じ盤面に乗ったパートは同時に弾く ── */
.stage { display:flex; flex-wrap:wrap; justify-content:center; gap:22px; margin-bottom:20px; }
.board-card { display:flex; flex-direction:column; align-items:center; }
.bc-head { display:flex; align-items:center; gap:8px; margin-bottom:4px; font-size:.62rem; font-weight:700;
  letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.bc-head .dot { width:7px; height:7px; border-radius:50%; background:var(--orange); }
.bc-head .dot.off { background:transparent; border:1.5px solid var(--muted); }
.bc-x { font-size:.58rem; padding:2px 7px; border:1px solid var(--mid); border-radius:5px; background:transparent;
  color:var(--muted); cursor:pointer; letter-spacing:.06em; }
.bc-x:hover { color:#f08080; border-color:#f08080; }

/* 盤面の縁にアバターがぎゅうぎゅうに並ぶ */
.crowd { display:flex; justify-content:center; align-items:flex-end; height:62px; margin-bottom:-6px; position:relative; z-index:2; }
.ava { position:relative; width:52px; height:56px; margin-left:-14px; transition:transform .2s; }
.ava:first-child { margin-left:0; }
.ava img { width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
.ava .tag { position:absolute; left:50%; top:-4px; transform:translateX(-50%); font-size:15px; line-height:1;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.6)); }
.ava.hop { animation:hop .32s ease-out; }
@keyframes hop { 0%{transform:translateY(0)} 35%{transform:translateY(-12px) scale(1.05)} 70%{transform:translateY(2px) scale(.97,1.03)} 100%{transform:translateY(0)} }
.ava.think { animation:wob .5s ease-in-out infinite alternate; }
.ava.think::after { content:'…'; position:absolute; right:-6px; top:4px; font-weight:900; color:var(--cream); font-size:14px; }
@keyframes wob { from{transform:rotate(-5deg)} to{transform:rotate(5deg)} }

.board {
  --bs: 360px;
  width:var(--bs); height:var(--bs); position:relative;
  display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr); gap:6px;
  padding:10px; background:#0f0d0c; border:2px solid var(--mid); border-radius:16px;
}
.cell {
  position:relative; border-radius:10px; background:#221d1a; overflow:hidden;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.45); cursor:pointer; user-select:none; -webkit-user-select:none; touch-action:none;
  transition:transform .12s ease-out;
}
.cell.pop { animation:keypop .26s ease-out; }
@keyframes keypop { 0%{transform:translateY(0)} 30%{transform:translateY(-5px) scale(1.07)} 100%{transform:translateY(0)} }
/* 光のレイヤー: 同じキーに複数のパートが重なると screen 合成で色が混ざる */
.glow {
  position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen;
  background:radial-gradient(circle at 50% 55%, var(--c) 0%, color-mix(in srgb, var(--c) 55%, transparent) 55%, transparent 100%);
  animation:glow var(--d,600ms) ease-out forwards;
}
@keyframes glow { 0%{opacity:1} 60%{opacity:.75} 100%{opacity:0} }
.nn { position:absolute; left:6px; bottom:4px; font-size:.55rem; font-weight:800; color:rgba(255,255,255,.85); pointer-events:none;
  animation:fadeout .9s ease-out forwards; text-shadow:0 1px 2px rgba(0,0,0,.6); }
@keyframes fadeout { 0%,50%{opacity:1} 100%{opacity:0} }
/* ポップアップ: キーから人格の顔が飛び出して浮いて消える */
.bubble {
  position:absolute; z-index:5; pointer-events:none; transform:translate(-50%,-50%);
  min-width:30px; height:30px; padding:0 6px; border-radius:15px; display:flex; align-items:center; justify-content:center;
  font-size:16px; background:#14110f; border:2px solid var(--c); box-shadow:0 0 12px var(--c);
  animation:bubble .95s cubic-bezier(.2,.9,.3,1) forwards;
}
@keyframes bubble {
  0%   { opacity:0; transform:translate(-50%,-30%) scale(.3); }
  18%  { opacity:1; transform:translate(-50%,-70%) scale(1.18); }
  35%  { transform:translate(-50%,-85%) scale(1); }
  100% { opacity:0; transform:translate(-50%,-190%) scale(.9); }
}

/* ── Parts ── */
.sec-title { font-size:.62rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0 0 8px 2px; }
.parts { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px; margin-bottom:12px; }
.part {
  display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:6px 10px; align-items:center;
  background:var(--dark); border:2px solid var(--mid); border-left:6px solid var(--pc,#555); border-radius:12px; padding:10px 10px 10px 8px;
}
.part .pav { grid-row:span 3; width:44px; height:48px; image-rendering:pixelated; }
.part .chips, .part .conn { grid-column:2 / 4; }
.part select {
  background:#1f1a17; color:var(--cream); border:1.5px solid var(--mid); border-radius:8px; padding:5px 6px;
  font-size:.75rem; font-weight:600; width:100%; min-width:0;
}
.part .rm { background:transparent; border:none; color:var(--muted); font-size:16px; cursor:pointer; padding:0 4px; }
.part .rm:hover { color:#f08080; }
.chips { display:flex; gap:4px; flex-wrap:wrap; }
.chip { width:22px; height:22px; border-radius:6px; border:2px solid transparent; cursor:pointer; background:var(--c); opacity:.45; }
.chip.sel { opacity:1; border-color:var(--cream); }
.chip:disabled { cursor:default; }
.conn { position:relative; }
.conn-btn { width:100%; padding:5px 8px; border:1.5px solid var(--mid); border-radius:8px; background:transparent; color:var(--cream);
  font-size:.7rem; font-weight:700; cursor:pointer; white-space:nowrap; text-align:left; }
.conn-btn:hover { border-color:var(--orange); }
.conn-btn.dev { border-color:var(--orange); color:var(--orange-bright); }
.menu {
  position:absolute; right:0; top:calc(100% + 4px); z-index:20; min-width:230px; background:#1f1a17; border:2px solid var(--mid);
  border-radius:10px; padding:6px; box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.menu button { display:block; width:100%; text-align:left; padding:8px 10px; border:none; border-radius:6px; background:transparent;
  color:var(--cream); font-size:.75rem; font-weight:600; cursor:pointer; }
.menu button:hover:not(:disabled) { background:var(--mid); }
.menu button:disabled { opacity:.35; cursor:not-allowed; }
.menu small { display:block; font-size:.62rem; color:var(--muted); font-weight:500; margin-top:2px; }
.add-row { display:flex; gap:8px; margin-bottom:20px; }

/* ── Collapsible ── */
details { background:var(--dark); border:2px solid var(--mid); border-radius:10px; margin-bottom:8px; }
summary { padding:9px 14px; cursor:pointer; font-size:.62rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.dbody { padding:4px 14px 14px; }
.srow { display:flex; align-items:center; justify-content:space-between; padding:6px 0; gap:10px; }
.srow+.srow { border-top:1px solid rgba(255,255,255,.05); }
.sname { font-size:.78rem; font-weight:600; opacity:.85; }
.sname small { display:block; font-size:.62rem; color:var(--muted); font-weight:500; }
.sctrl { display:flex; align-items:center; gap:8px; }
.sval { font-size:.75rem; font-weight:700; color:var(--orange); min-width:32px; text-align:right; }
.log { font-size:.65rem; font-family:'SF Mono','Fira Code',monospace; color:var(--muted); max-height:180px; overflow-y:auto; line-height:1.7; user-select:text; }
.log .ok { color:#7ec87e; } .log .err { color:#e07070; } .log .info { color:var(--orange); }
</style>

<body>
<div class="wrap">

  <div class="top">
    <a class="home" href="index.html" title="アプリ一覧へ">‹</a>
    <span class="title">AI DUET</span>
    <div class="bpm">BPM <input type="range" id="bpm" min="60" max="187" step="1" value="100"><b id="bpmVal">100</b></div>
    <button class="btn" id="autoBtn" title="あなたが弾かなくても、AI たちが弾きつづける">▶ AIだけで回す</button>
  </div>

  <div class="banner" id="banner"></div>
  <div class="hint" id="hint"></div>

  <div class="stage" id="stage"></div>

  <div class="sec-title">パート</div>
  <div class="parts" id="parts"></div>
  <div class="add-row">
    <button class="btn" id="addAi">＋ AI をふやす</button>
    <button class="btn" id="addHuman">＋ ひとをふやす</button>
  </div>

  <details>
    <summary>Settings</summary>
    <div class="dbody">
      <div class="srow"><span class="sname">あばれ度<small>AI の予想外さ (temperature の倍率)</small></span>
        <div class="sctrl"><input type="range" id="wild" min="0.6" max="1.6" step="0.1" value="1"><span class="sval" id="wildVal">1.0</span></div></div>
      <div class="srow"><span class="sname">何音で答えるか<small>あなたがこの数だけ弾いて手を止めると AI が答える</small></span>
        <div class="sctrl"><input type="range" id="trig" min="2" max="8" step="1" value="4"><span class="sval" id="trigVal">4</span></div></div>
      <div class="srow"><span class="sname">ブラウザの音<small>OFF でも本体の光とキーは動く</small></span>
        <div class="sctrl"><button class="btn on" id="soundBtn">ON</button></div></div>
    </div>
  </details>
  <details>
    <summary>Debug Log</summary>
    <div class="dbody"><div class="log" id="log"></div></div>
  </details>
</div>

<script>
'use strict';
// ============================================================================
//  PONKEY AI Duet v2
//   ・パート = 「あなた」か AI 人格。各パートは接続時に「新しい PONKEY / つないである PONKEY を共有 /
//     画面だけ」を選ぶ。1台でも複数台でも同じ画面で扱う。
//   ・同じ PONKEY に乗った AI たちは**同じ盤面で同時に弾く**。それぞれのパート色で光り
//     (SONG_CMD_LED_FRAME = 床上げ合成なので重なると混ざる)、キーが跳ね (SONG_CMD_SOL fire)、
//     画面ではキーから顔が飛び出す。
//   ・AI は誰かのフレーズ (あなた or 別の AI) を聞いて、全員がいっせいに続きを弾く。
// ============================================================================
const PARTS = Ponkey.PARTS;                 // index = 本体のパート番号 (0=P1 ドラム, 1-6=P2-P7)
const MEL = [1, 2, 3, 4, 5, 6];             // メロディ6パート
const CC_BPM = 0x41, CC_STATE_SYNC = 0x51, CC_VOICE = 0x30;
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const midiName = m => NOTE_NAMES[m % 12] + (Math.floor(m / 12) - 1);

// ── AI 人格 ─────────────────────────────────────────────────────────────
//   part  = 既定のパート (色と音域)。temp = MusicRNN の temperature。
//   len   = 聞いたフレーズに対する返事の長さ倍率。stretch = 音価の倍率 (大きいほどゆったり)。
//   density = 残す音の割合。lag = 入りの遅れ (16分音符いくつ)。重なりの「食い気味さ」を作る。
//   vel   = ソレノイドの強さ (90+ = 全力 / 50-89 = 中 / それ未満 = ちょっと浮く)。
//   mimic = 学習モデルを使わず、聞いたフレーズを度数でずらしてまねる。
const PERSONAS = {
  tako:  { emoji:'🐙', name:'タコ',   desc:'おしゃべり', part:2, temp:1.25, len:1.2, stretch:1,   density:1.0, lag:0, vel:100 },
  kame:  { emoji:'🐢', name:'カメ',   desc:'のんびり',   part:4, temp:0.9,  len:0.6, stretch:2,   density:0.7, lag:4, vel:60  },
  kaeru: { emoji:'🐸', name:'カエル', desc:'まねっこ',   part:5, temp:1.0,  len:1.0, stretch:1,   density:1.0, lag:2, vel:80, mimic:true },
  zou:   { emoji:'🐘', name:'ゾウ',   desc:'どっしり',   part:3, temp:0.8,  len:0.7, stretch:2,   density:0.6, lag:0, vel:110 },
  tori:  { emoji:'🐦', name:'トリ',   desc:'きまぐれ',   part:1, temp:1.45, len:1.0, stretch:1,   density:0.75,lag:1, vel:90  },
  obake: { emoji:'👻', name:'オバケ', desc:'ささやき',   part:6, temp:1.1,  len:0.8, stretch:1.5, density:0.8, lag:6, vel:40  },
};
const PERSONA_ORDER = Object.keys(PERSONAS);
const HUMAN = { emoji:'🙂', name:'あなた' };

// ── State ───────────────────────────────────────────────────────────────
const S = {
  parts: [],            // {id, kind:'human'|'ai', persona, part, dev:null|deviceId, thinking, buf, held}
  devices: [],          // {id, pk, name, curPart, kit, lights[16]:Map, sent[16], pend}
  bpm: 100, wild: 1.0, trig: 4, sound: true, auto: false,
  round: 0,             // 進行中のラウンド番号。あなたが弾くと進んで、古い AI の音は捨てられる
  busy: 0,              // 再生中の AI の数
  last: null,           // 最後に鳴ったフレーズ
};
let nextPartId = 1, nextDevId = 1;
const stepMs = () => 60000 / S.bpm / 4;
const T0 = performance.now();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ── Log / banner ────────────────────────────────────────────────────────
function log(msg, cls = '') {
  const el = document.getElementById('log'); if (!el) return;
  const d = new Date(), ts = String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
  const line = document.createElement('div'); line.className = cls; line.textContent = `[${ts}] ${msg}`;
  el.appendChild(line); while (el.children.length > 150) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}
function banner(msg) { const b = document.getElementById('banner'); b.textContent = msg ? '⚠ ' + msg : ''; b.classList.toggle('show', !!msg); }

// ── 音階: パートの白鍵テーブル + 音域シフト ─────────────────────────────
const tableOf  = part => PARTS[part].table.map(n => n + PARTS[part].shift);   // index = キー番号
const ladderOf = part => [...new Set(tableOf(part))].sort((a, b) => a - b);    // 低い順の音の段
function fold(p, lo, hi) { while (p > hi) p -= 12; while (p < lo) p += 12; return p; }
function snapIdx(ladder, p) { let bi = 0, bd = 1e9; ladder.forEach((v, i) => { const d = Math.abs(v - p); if (d < bd) { bd = d; bi = i; } }); return bi; }
function pitchToKey(part, pitch) {
  const lad = ladderOf(part), p = fold(pitch, lad[0], lad[lad.length - 1]);
  const snapped = lad[snapIdx(lad, p)];
  return { key: tableOf(part).indexOf(snapped), pitch: snapped };
}

// ── 見た目: パート色のドット絵 ─────────────────────────────────────────
const SPRITE = [
  '...KKKKKKKKK...',
  '..KOOOOOOOOOK..',
  '.KOOOOOOOOOOOK.',
  'KOOOOOOOOOOOOOK',
  'KOKWWKWWKWWKOOK',
  'KOKWWKWWKWWKOOK',
  'KOOOOOOOOOOOOOK',
  'KOOOOOOOOOOOOOK',
  '.KOOOOOOOOOOOK.',
  'KOK.KOK.KOK.KOK',
  'KOK.KOK.KOK.KOK',
  'KK..KK..KK..KK.',
];
const spriteCache = {};
function spriteURL(color) {
  if (spriteCache[color]) return spriteCache[color];
  const c = document.createElement('canvas'); c.width = 15; c.height = SPRITE.length;
  const x = c.getContext('2d');
  SPRITE.forEach((row, y) => [...row].forEach((ch, i) => {
    const col = ch === 'K' ? '#0e0c0b' : ch === 'O' ? color : ch === 'W' ? '#ffffff' : null;
    if (col) { x.fillStyle = col; x.fillRect(i, y, 1, 1); }
  }));
  return (spriteCache[color] = c.toDataURL());
}
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

// パートの今の色 (あなた = つないだ本体で選ばれているパートの色)
function partColorIdx(p) {
  if (p.kind === 'human' && p.dev != null) { const d = devById(p.dev); if (d) return d.curPart; }
  return p.part;
}
const partColor = p => PARTS[partColorIdx(p)].rgb;
const partFace  = p => p.kind === 'human' ? HUMAN.emoji : PERSONAS[p.persona].emoji;
const partName  = p => p.kind === 'human' ? HUMAN.name : PERSONAS[p.persona].name;

// ── 盤面 ───────────────────────────────────────────────────────────────
const devById = id => S.devices.find(d => d.id === id);
const boardKey = p => p.dev == null ? 'screen' : 'd' + p.dev;

function renderStage() {
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  const boards = S.devices.map(d => ({ key: 'd' + d.id, dev: d }));
  if (S.parts.some(p => p.dev == null) || !boards.length) boards.push({ key: 'screen', dev: null });
  const n = boards.length;
  const vw = Math.min(window.innerWidth, 980) - 32;
  const bs = n === 1 ? Math.min(vw, window.innerHeight * 0.55, 440)
                     : Math.min((vw - 22) / Math.min(n, 2), window.innerHeight * 0.42, 360);
  for (const b of boards) {
    const card = document.createElement('div'); card.className = 'board-card'; card.dataset.board = b.key;
    const head = document.createElement('div'); head.className = 'bc-head';
    head.innerHTML = b.dev
      ? `<span class="dot"></span><span>${escapeHtml(b.dev.name)}</span>`
      : `<span class="dot off"></span><span>画面だけ</span>`;
    if (b.dev) {
      const x = document.createElement('button'); x.className = 'bc-x'; x.textContent = '切断';
      x.onclick = () => disconnectDevice(b.dev); head.appendChild(x);
    }
    card.appendChild(head);
    const crowd = document.createElement('div'); crowd.className = 'crowd';
    S.parts.filter(p => boardKey(p) === b.key).forEach(p => {
      const a = document.createElement('div'); a.className = 'ava'; a.dataset.part = p.id;
      a.innerHTML = `<img alt=""><span class="tag"></span>`;
      a.title = partName(p);
      crowd.appendChild(a);
    });
    card.appendChild(crowd);
    const board = document.createElement('div'); board.className = 'board'; board.style.setProperty('--bs', Math.round(bs) + 'px');
    for (let k = 0; k < 16; k++) {
      const c = document.createElement('div'); c.className = 'cell'; c.dataset.key = k;
      c.addEventListener('pointerdown', e => { e.preventDefault(); screenPress(b.key, k, true); });
      c.addEventListener('pointerup', () => screenPress(b.key, k, false));
      c.addEventListener('pointerleave', () => screenPress(b.key, k, false));
      board.appendChild(c);
    }
    card.appendChild(board);
    stage.appendChild(card);
  }
  refreshAvatars();
}
function refreshAvatars() {
  S.parts.forEach(p => {
    const col = partColor(p);
    document.querySelectorAll(`.ava[data-part="${p.id}"]`).forEach(a => {
      a.querySelector('img').src = spriteURL(col);
      a.querySelector('.tag').textContent = partFace(p);
      a.classList.toggle('think', !!p.thinking);
    });
    const row = document.querySelector(`.part[data-part="${p.id}"]`);
    if (row) { row.style.setProperty('--pc', col); row.querySelector('.pav').src = spriteURL(col); }
  });
}
function hop(p) {
  document.querySelectorAll(`.ava[data-part="${p.id}"]`).forEach(a => {
    if (a.classList.contains('think')) return;
    a.classList.remove('hop'); void a.offsetWidth; a.classList.add('hop');
  });
}

// 画面の盤面で1音を光らせる: 光のレイヤー + キーが跳ねる + 顔が飛び出す
function screenPulse(bkey, key, color, face, durMs, label) {
  const board = document.querySelector(`.board-card[data-board="${bkey}"] .board`);
  if (!board) return;
  const cell = board.children[key]; if (!cell) return;
  const g = document.createElement('i'); g.className = 'glow';
  g.style.setProperty('--c', color); g.style.setProperty('--d', clamp(durMs + 300, 380, 1800) + 'ms');
  g.addEventListener('animationend', () => g.remove()); cell.appendChild(g);
  if (label) {
    cell.querySelectorAll('.nn').forEach(x => x.remove());
    const t = document.createElement('span'); t.className = 'nn'; t.textContent = label;
    t.addEventListener('animationend', () => t.remove()); cell.appendChild(t);
  }
  cell.classList.remove('pop'); void cell.offsetWidth; cell.classList.add('pop');
  if (face) {
    const bubble = document.createElement('b'); bubble.className = 'bubble'; bubble.textContent = face;
    bubble.style.setProperty('--c', color);
    // ぎゅうぎゅう感: 同じキーに重なっても見えるよう少しずらす
    const jx = (Math.random() - 0.5) * 0.12, jy = (Math.random() - 0.5) * 0.06;
    bubble.style.left = ((key % 4 + 0.5) / 4 + jx) * 100 + '%';
    bubble.style.top  = ((Math.floor(key / 4) + 0.5) / 4 + jy) * 100 + '%';
    bubble.addEventListener('animationend', () => bubble.remove());
    board.appendChild(bubble);
  }
}

// ── 本体の光 (パートごとに重ねて合成) ───────────────────────────────────
//   本体の RGB オーバーレイはキーごとに1色しか持てないので、アプリ側で
//   「このキーに今どのパートの光が乗っているか」を持ち、チャンネルごとの最大値を送る。
function devLight(d, key, owner, rgb, lvl) {
  const m = d.lights[key];
  if (lvl > 0) m.set(owner.id, { rgb, lvl, nonce: owner.nonce });
  else { const cur = m.get(owner.id); if (cur && cur.nonce === owner.nonce) m.delete(owner.id); }
  let r = 0, g = 0, b = 0;
  m.forEach(v => { r = Math.max(r, v.rgb[0] * v.lvl); g = Math.max(g, v.rgb[1] * v.lvl); b = Math.max(b, v.rgb[2] * v.lvl); });
  const s = [r, g, b].map(Math.round), str = s.join(',');
  if (str === d.sent[key]) return;
  // 送信が詰まっているときは途中の減光を飛ばす (点灯と消灯は必ず送る)
  if (lvl > 0 && lvl < 1 && d.pend > 10) return;
  d.sent[key] = str;
  send(d, () => d.pk.ledSet(key, s[0], s[1], s[2]));
}
function send(d, fn) {
  d.pend++;
  let pr; try { pr = fn(); } catch (e) { pr = Promise.reject(e); }
  Promise.resolve(pr).catch(() => {}).finally(() => { d.pend--; });
}
let nonceSeq = 0;
function devFire(d, key, color, durMs, vel, partId) {
  const pk = d.pk;
  if (pk.hasFeature('SOL_API')) send(d, () => pk.solFire(key, vel));
  else send(d, () => pk.noteOn(0, key, 100));              // 旧FW: data1<16 = キー番号直送
  if (!pk.hasFeature('LED_RGB_FRAME')) return;              // 旧FW は本体の今のパート色で光るだけ
  const owner = { id: partId, nonce: ++nonceSeq }, rgb = hexRgb(color);
  devLight(d, key, owner, rgb, 1);
  const hold = clamp(durMs, 90, 320);
  setTimeout(() => devLight(d, key, owner, rgb, 0.3), hold);
  setTimeout(() => devLight(d, key, owner, rgb, 0), hold + 110);
}
function devClearPart(d, partId) {
  d.lights.forEach((m, k) => { const v = m.get(partId); if (v) devLight(d, k, { id: partId, nonce: v.nonce }, v.rgb, 0); });
}

// ── 音 (ブラウザ) ───────────────────────────────────────────────────────
let toneReady = false; const synth = {};
const SYNTH_CFG = {     // パート番号 → 音色 (旧 duet と同じ)
  1: { osc:'triangle',    atk:.005, dec:.3, sus:.5, rel:.2 },
  2: { osc:'sawtooth',    atk:.01,  dec:.2, sus:.6, rel:.25 },
  3: { osc:'triangle',    atk:.005, dec:.3, sus:.6, rel:.15, mono:true },
  4: { osc:'fatsawtooth', atk:.35,  dec:.3, sus:.8, rel:1.0 },
  5: { osc:'sine',        atk:.001, dec:.6, sus:0,  rel:.5 },
  6: { osc:'triangle',    atk:.12,  dec:.3, sus:.7, rel:.6 },
};
function initTone() {
  if (toneReady || typeof Tone === 'undefined') return;
  toneReady = true;
  Tone.start().then(() => {
    Tone.Destination.volume.value = -6;
    for (const part of MEL) {
      const c = SYNTH_CFG[part], vol = new Tone.Volume(-10).toDestination();
      const cfg = { oscillator: { type: c.osc }, envelope: { attack: c.atk, decay: c.dec, sustain: c.sus, release: c.rel } };
      synth[part] = c.mono
        ? new Tone.MonoSynth({ ...cfg, portamento: .04, filterEnvelope: { attack: .001, decay: .1, sustain: .6, release: .2, baseFrequency: 200, octaves: 3 } }).connect(vol)
        : new Tone.PolySynth(Tone.Synth, cfg).connect(vol);
    }
    log('Tone.js ready', 'ok');
  }).catch(e => { toneReady = false; log('Tone err: ' + e.message, 'err'); });
}
function playTone(part, midi, durMs, vel = 100) {
  if (!S.sound || !synth[part]) return;
  try { synth[part].triggerAttackRelease(Tone.Frequency(midi, 'midi').toFrequency(), Math.max(.05, durMs / 1000), undefined, clamp(vel / 127, .25, 1)); } catch (e) {}
}
document.addEventListener('pointerdown', initTone, { capture: true });

// ── 1音を鳴らす (AI / 画面から弾いたあなた) ────────────────────────────
function sounding(p, pitch, durMs, vel, { tone = true } = {}) {
  const { key, pitch: snapped } = pitchToKey(partColorIdx(p) || 1, pitch);
  const color = partColor(p);
  screenPulse(boardKey(p), key, color, partFace(p), durMs, midiName(snapped));
  hop(p);
  if (tone) playTone(partColorIdx(p) || 1, snapped, durMs, vel);
  const d = p.dev != null ? devById(p.dev) : null;
  if (d) devFire(d, key, color, durMs, vel, p.id);
  return snapped;
}

// ── MusicRNN ────────────────────────────────────────────────────────────
let rnn = null, rnnReady = false;
async function loadAI() {
  try {
    if (typeof music_rnn === 'undefined') throw new Error('Magenta not loaded');
    rnn = new music_rnn.MusicRNN('https://storage.googleapis.com/magentadata/js/checkpoints/music_rnn/melody_rnn');
    await rnn.initialize();
    rnnReady = true; log('MusicRNN ready', 'ok'); updateHint();
  } catch (e) {
    rnnReady = false;
    log('MusicRNN error: ' + e.message + ' — 簡易 AI で続けます', 'err');
    updateHint();
  }
}

// フレーズ = { from, notes:[{pitch,start,dur}] (16分音符単位), total }
function toQNS(phrase) {
  const ns = [...phrase.notes].sort((a, b) => a.start - b.start || b.pitch - a.pitch);
  const mono = [];
  for (const n of ns) {                         // 同時に鳴った音は上を採って単旋律に
    const prev = mono[mono.length - 1];
    if (prev && prev.start === n.start) continue;
    if (prev && prev.start + prev.dur > n.start) prev.dur = n.start - prev.start;
    mono.push({ ...n });
  }
  let total = 0;
  const notes = mono.filter(n => n.dur > 0).map(n => {
    total = Math.max(total, n.start + n.dur);
    return { pitch: fold(n.pitch, 48, 83), quantizedStartStep: n.start, quantizedEndStep: n.start + n.dur };
  });
  return { quantizationInfo: { stepsPerQuarter: 4 }, notes, totalQuantizedSteps: Math.max(1, total) };
}

let mimicFlip = 1;
async function generate(p, phrase) {
  const P = PERSONAS[p.persona], part = p.part;
  const lad = ladderOf(part);
  let notes = [];
  if (P.mimic) {
    // 聞いたフレーズの形のまま、自分の音域で度数を ±2 ずらしてまねる
    mimicFlip = -mimicFlip;
    notes = phrase.notes.map((n, i) => {
      const j = clamp(snapIdx(lad, fold(n.pitch, lad[0], lad[lad.length - 1])) + 2 * mimicFlip + (i === phrase.notes.length - 1 ? -mimicFlip : 0), 0, lad.length - 1);
      return { pitch: lad[j], start: n.start, dur: n.dur };
    });
  } else if (rnnReady) {
    const qns = toQNS(phrase);
    const steps = clamp(Math.round(qns.totalQuantizedSteps * P.len * (0.8 + Math.random() * 0.4)), 8, 32);
    const temp = clamp(P.temp * S.wild, 0.3, 2.0);
    try {
      const r = await rnn.continueSequence(qns, steps, temp);
      notes = r.notes.map(n => ({ pitch: n.pitch, start: n.quantizedStartStep, dur: Math.max(1, n.quantizedEndStep - n.quantizedStartStep) }));
    } catch (e) { log(`${P.name}: RNN error ${e.message}`, 'err'); }
  }
  if (!notes.length) notes = randomWalk(lad, phrase, P);
  // 人格で形を整える: ゆったり度 / 間引き
  notes = notes.map(n => ({ ...n, start: Math.round(n.start * P.stretch), dur: Math.max(1, Math.round(n.dur * P.stretch)) }));
  if (P.density < 1 && notes.length > 2) {
    const kept = notes.filter(() => Math.random() < P.density);
    notes = kept.length >= 2 ? kept : notes.slice(0, 2);
  }
  return notes;
}
function randomWalk(lad, phrase, P) {        // モデルが無いときの簡易 AI
  const len = clamp(Math.round((phrase.notes.length || 4) * P.len), 3, 10);
  let j = Math.floor(lad.length / 2), t = 0; const out = [];
  for (let i = 0; i < len; i++) {
    j = clamp(j + Math.round((Math.random() - 0.5) * 4 * P.temp), 0, lad.length - 1);
    const dur = Math.random() < 0.3 ? 2 : 1;
    out.push({ pitch: lad[j], start: t, dur }); t += dur + (Math.random() < 0.15 ? 1 : 0);
  }
  return out;
}

// ── 進行: 誰かのフレーズに AI 全員がいっせいに答える ─────────────────────
function nextBeat(t) { const beat = stepMs() * 4; return T0 + Math.ceil((t - T0) / beat) * beat; }

function publish(phrase) {
  S.last = phrase;
  if (phrase.human) { S.round++; S.parts.forEach(p => { p.thinking = false; }); refreshAvatars(); }
  respond(phrase, S.round);
}

async function respond(phrase, round) {
  // お題を出した本人も含めて AI 全員が同時に弾く (同じ盤面に乗っていれば重なって光る)
  const ais = S.parts.filter(p => p.kind === 'ai');
  if (!ais.length) return;
  const base = nextBeat(performance.now() + 120);
  const plays = ais.map(async p => {
    p.thinking = true; refreshAvatars();
    let notes;
    try { notes = await generate(p, phrase); } finally { p.thinking = false; refreshAvatars(); }
    if (round !== S.round) return null;
    log(`${PERSONAS[p.persona].emoji} ${PERSONAS[p.persona].name}: ${notes.length} 音`, '');
    const start = Math.max(base + PERSONAS[p.persona].lag * stepMs(), performance.now() + 40);
    return play(p, notes, start, round);
  });
  S.busy++;
  const results = (await Promise.all(plays)).filter(Boolean);
  S.busy--;
  if (round !== S.round || !results.length) return;
  // AIだけで回す: いちばん音の多かった人の返事を次のお題にして続ける
  if (S.auto) {
    const next = results.reduce((a, b) => (b.notes.length > a.notes.length ? b : a));
    setTimeout(() => { if (round === S.round && S.auto) respond(next, round); }, stepMs() * 4);
  }
}

function play(p, notes, startAt, round) {
  const P = PERSONAS[p.persona], sm = stepMs();
  const played = [];
  let endStep = 0;
  for (const n of notes) {
    endStep = Math.max(endStep, n.start + n.dur);
    setTimeout(() => {
      if (round !== S.round || !S.parts.includes(p)) return;
      const pitch = sounding(p, n.pitch, n.dur * sm * 0.9, P.vel);
      played.push({ pitch, start: n.start, dur: n.dur });
    }, Math.max(0, startAt + n.start * sm - performance.now()));
  }
  return new Promise(res => setTimeout(() => res({ from: p.id, notes: played, total: endStep }),
                                       Math.max(0, startAt + endStep * sm - performance.now()) + 30));
}

// ── あなたの入力 (本体の鍵 / 画面の盤面) ──────────────────────────────
function humanOn(p, pitch) {
  const t = performance.now();
  if (!p.buf.length) p.t0 = t;
  p.held.set(pitch, t);
  clearTimeout(p.timer);
}
function humanOff(p, pitch) {
  const t = performance.now(), on = p.held.get(pitch);
  if (on == null) return;
  p.held.delete(pitch);
  const sm = stepMs();
  p.buf.push({ pitch, start: Math.round((on - p.t0) / sm), dur: Math.max(1, Math.round((t - on) / sm)) });
  clearTimeout(p.timer);
  if (p.buf.length >= 16) return flushHuman(p);
  if (p.buf.length >= S.trig && !p.held.size)
    p.timer = setTimeout(() => flushHuman(p), Math.max(250, sm * 3));   // 少し手が止まったら答える
}
function flushHuman(p) {
  if (!p.buf.length) return;
  const notes = p.buf; p.buf = [];
  const total = notes.reduce((m, n) => Math.max(m, n.start + n.dur), 0);
  log(`${HUMAN.name}: ${notes.length} 音 → AI ${S.parts.filter(x => x.kind === 'ai').length} 人が答える`, 'info');
  publish({ from: p.id, human: true, notes, total });
}

// 画面の盤面を押した = その盤面に乗っている「あなた」が弾いた
const screenHeld = {};
function screenPress(bkey, key, down) {
  const id = bkey + ':' + key;
  if (!down) {
    const h = screenHeld[id]; if (!h) return; delete screenHeld[id];
    humanOff(h.p, h.pitch); return;
  }
  const p = S.parts.find(x => x.kind === 'human' && boardKey(x) === bkey);
  if (!p) { updateHint('この盤面には「あなた」がいません。パートに「ひと」を足すと画面からも弾けます'); return; }
  const part = partColorIdx(p) || 1;
  const pitch = tableOf(part)[key];
  screenHeld[id] = { p, pitch };
  // 画面から弾いた音は本体にも同じキーで跳ねてもらう (本体の音は鳴らないのでブラウザで鳴らす)
  sounding(p, pitch, 240, 100);
  humanOn(p, pitch);
}

// ── BLE ────────────────────────────────────────────────────────────────
async function connectNew() {
  const pk = new Ponkey();
  const d = { id: nextDevId++, pk, name: '', curPart: 1, kit: 0,
              lights: Array.from({ length: 16 }, () => new Map()), sent: Array(16).fill('0,0,0'), pend: 0 };
  pk.on('disconnect', () => onDeviceGone(d));
  pk.on('note', e => onDeviceNote(d, e));
  pk.on('cc', e => onDeviceCC(d, e));
  log('PONKEY をさがしています…', 'info');
  await pk.connect({ debug: true });               // 光とキー (SONG_CMD) にデバッグサービスが要る
  d.name = pk.device.name || ('PONKEY ' + d.id);
  S.devices.push(d);
  log(`${d.name} につながりました`, 'ok');
  setTimeout(async () => {
    try {
      await pk.sendCC(CC_STATE_SYNC, 127);
      await pk.sendCC(CC_BPM, clamp(S.bpm - 60, 0, 127));
      if (!pk.hasFeature('SOL_API') || !pk.hasFeature('LED_RGB_FRAME'))
        log(`${d.name}: 古いファームのため、パートごとの色は出せません (本体の今のパート色で光ります)`, 'err');
    } catch (e) { log('init err: ' + e.message, 'err'); }
  }, 400);
  return d;
}
function disconnectDevice(d) {
  try { d.pk.ledClear(); } catch (e) {}
  setTimeout(() => { try { d.pk.disconnect(); } catch (e) {} onDeviceGone(d); }, 80);
}
function onDeviceGone(d) {
  if (!S.devices.includes(d)) return;
  S.devices = S.devices.filter(x => x !== d);
  S.parts.forEach(p => { if (p.dev === d.id) p.dev = null; });
  log(`${d.name} が切れました。乗っていたパートは「画面だけ」に戻ります`, 'err');
  renderAll();
}
let warnedNoHuman = false;
function onDeviceNote(d, e) {
  const human = S.parts.find(p => p.kind === 'human' && p.dev === d.id);
  if (e.ch === Ponkey.DRUM_CH) {                   // P1 ドラムキット: 光だけ (旋律の AI には渡さない)
    if (!e.on) return;
    const k = Ponkey.keyFromNote(e.ch, e.note, d.kit);
    if (k != null) screenPulse('d' + d.id, k, Ponkey.KIT_COL_RGB[k % 4], human ? HUMAN.emoji : null, 200, null);
    return;
  }
  const part = PARTS.findIndex(p => p.ch === e.ch || p.chL2 === e.ch);
  if (part < 1) return;
  if (e.on) {
    if (d.curPart !== part) { d.curPart = part; refreshAvatars(); }
    const k = Ponkey.keyFromNote(e.ch, e.note);
    if (k != null) screenPulse('d' + d.id, k, PARTS[part].rgb, human ? HUMAN.emoji : null, 260, midiName(e.note));
    if (human) { hop(human); humanOn(human, e.note); }
    else if (!warnedNoHuman) { warnedNoHuman = true; updateHint(`${d.name} には「あなた」が乗っていないので、弾いても AI は聞いていません`); }
  } else if (human) humanOff(human, e.note);
}
function onDeviceCC(d, e) {
  if (e.cc <= 6 && e.val >= 64) { d.curPart = e.cc; refreshAvatars(); return; }   // 本体でパートを選んだ
  if (e.cc === CC_VOICE && ((e.val >> 4) & 15) === 0) d.kit = e.val & 7;          // P1 のキット番号
}
function sendBPM() {
  S.devices.forEach(d => send(d, () => d.pk.sendCC(CC_BPM, clamp(S.bpm - 60, 0, 127))));
}

// ── パートの一覧 ───────────────────────────────────────────────────────
function addPart(kind, persona) {
  if (kind === 'ai') {
    const ais = S.parts.filter(p => p.kind === 'ai');
    if (ais.length >= 6) return updateHint('AI は6人まで (パートの色が6つなので)');
    persona = persona || PERSONA_ORDER.find(k => !ais.some(p => p.persona === k)) || PERSONA_ORDER[0];
    const used = new Set(ais.map(p => p.part));
    const part = used.has(PERSONAS[persona].part) ? MEL.find(m => !used.has(m)) : PERSONAS[persona].part;
    S.parts.push({ id: nextPartId++, kind, persona, part, dev: null, thinking: false });
  } else {
    S.parts.push({ id: nextPartId++, kind: 'human', part: 1, dev: null, buf: [], held: new Map(), timer: 0 });
  }
}
function setPartColor(p, part) {
  // AI どうしは色 (= パート) がかぶらないように、かぶった相手と入れ替える
  if (p.kind === 'ai') {
    const other = S.parts.find(x => x !== p && x.kind === 'ai' && x.part === part);
    if (other) other.part = p.part;
  }
  p.part = part;
}
function bindPart(p, dev) {
  if (p.kind === 'human') {
    const bk = dev == null ? 'screen' : 'd' + dev;
    const other = S.parts.find(x => x !== p && x.kind === 'human' && boardKey(x) === bk);
    if (other) { updateHint('1つの盤面に「あなた」は1人まで (どの手がだれの音か分からなくなるので)'); return; }
  }
  const old = p.dev != null ? devById(p.dev) : null;
  if (old) devClearPart(old, p.id);
  p.dev = dev;
  renderAll();
}

let openMenu = null;
function closeMenu() { if (openMenu) { openMenu.remove(); openMenu = null; } }
document.addEventListener('pointerdown', e => { if (openMenu && !openMenu.contains(e.target) && !e.target.closest('.conn-btn')) closeMenu(); });

function showConnMenu(p, anchor) {
  closeMenu();
  const m = document.createElement('div'); m.className = 'menu';
  const item = (html, fn, disabled) => {
    const b = document.createElement('button'); b.innerHTML = html; b.disabled = !!disabled;
    b.onclick = async () => { closeMenu(); await fn(); }; m.appendChild(b);
  };
  item('＋ あたらしい PONKEY につなぐ<small>Bluetooth で本体をえらぶ</small>', async () => {
    if (!navigator.bluetooth) { banner('このブラウザは Bluetooth が使えません (Chrome / Edge で開いてください)'); return; }
    try { banner(''); const d = await connectNew(); bindPart(p, d.id); }
    catch (e) { log('接続できませんでした: ' + e.message, 'err'); }
  });
  S.devices.forEach(d => {
    const riders = S.parts.filter(x => x.dev === d.id && x !== p);
    const faces = riders.map(partFace).join('');
    const hasHuman = p.kind === 'human' && riders.some(x => x.kind === 'human');
    item(`🔗 ${escapeHtml(d.name)} をシェア<small>${riders.length ? 'いま乗っている: ' + faces : 'まだだれも乗っていない'}${hasHuman ? ' (あなたは乗っている)' : ''}</small>`,
         () => bindPart(p, d.id), p.dev === d.id || hasHuman);
  });
  item('🖥 画面だけ<small>本体なしで、画面とブラウザの音で弾く</small>', () => bindPart(p, null), p.dev == null);
  anchor.parentElement.appendChild(m);
  openMenu = m;
}

function renderParts() {
  const box = document.getElementById('parts'); box.innerHTML = '';
  S.parts.forEach(p => {
    const row = document.createElement('div'); row.className = 'part'; row.dataset.part = p.id;
    const img = document.createElement('img'); img.className = 'pav'; img.alt = ''; row.appendChild(img);

    const sel = document.createElement('select');
    if (p.kind === 'human') {
      sel.innerHTML = `<option>${HUMAN.emoji} ${HUMAN.name}</option>`; sel.disabled = true;
    } else {
      PERSONA_ORDER.forEach(k => { const P = PERSONAS[k]; const o = new Option(`${P.emoji} ${P.name} — ${P.desc}`, k); sel.appendChild(o); });
      sel.value = p.persona;
      sel.onchange = () => { p.persona = sel.value; setPartColor(p, PERSONAS[p.persona].part); renderAll(); };
    }
    row.appendChild(sel);

    const rm = document.createElement('button'); rm.className = 'rm'; rm.textContent = '×'; rm.title = 'このパートを外す';
    rm.onclick = () => {
      const d = p.dev != null ? devById(p.dev) : null; if (d) devClearPart(d, p.id);
      S.parts = S.parts.filter(x => x !== p); renderAll();
    };
    row.appendChild(rm);

    const chips = document.createElement('div'); chips.className = 'chips';
    const humanOnDev = p.kind === 'human' && p.dev != null;
    MEL.forEach(m => {
      const c = document.createElement('button'); c.className = 'chip'; c.style.setProperty('--c', PARTS[m].rgb);
      c.title = `P${m + 1} ${PARTS[m].name} (${PARTS[m].ja})` + (humanOnDev ? ' — 本体で選んだパートになります' : '');
      if (partColorIdx(p) === m) c.classList.add('sel');
      c.disabled = humanOnDev;
      c.onclick = () => { setPartColor(p, m); renderAll(); };
      chips.appendChild(c);
    });
    row.appendChild(chips);

    const conn = document.createElement('div'); conn.className = 'conn';
    const cb = document.createElement('button'); cb.className = 'conn-btn';
    const d = p.dev != null ? devById(p.dev) : null;
    cb.textContent = (d ? '🔗 ' + d.name : '🖥 画面だけ') + ' ▾';
    if (d) cb.classList.add('dev');
    cb.onclick = () => (openMenu ? closeMenu() : showConnMenu(p, cb));
    conn.appendChild(cb); row.appendChild(conn);

    box.appendChild(row);
  });
}

function renderAll() { closeMenu(); renderParts(); renderStage(); updateHint(); save(); }

function updateHint(msg) {
  const el = document.getElementById('hint');
  if (msg) { el.textContent = msg; clearTimeout(updateHint.t); updateHint.t = setTimeout(() => updateHint(), 5000); return; }
  const ais = S.parts.filter(p => p.kind === 'ai').length, humans = S.parts.filter(p => p.kind === 'human').length;
  const shared = S.devices.filter(d => S.parts.filter(p => p.dev === d.id && p.kind === 'ai').length >= 2);
  let t;
  if (!ais) t = '「＋ AI をふやす」で相手を呼んでください';
  else if (S.auto) t = 'AI たちが弾きつづけています';
  else if (humans) t = `${S.trig} 音ほど弾いて手を止めると、AI ${ais} 人がいっせいに答えます`;
  else t = '▶ を押すと AI たちが弾きはじめます';
  if (shared.length) t += ` ・ ${shared.map(d => d.name).join(' / ')} は ${'AI ' + Math.max(...shared.map(d => S.parts.filter(p => p.dev === d.id && p.kind === 'ai').length))} 人でシェア中`;
  if (!rnnReady) t += ' (AI モデル読み込み中…)';
  el.textContent = t;
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }

// ── 保存 (パートの顔ぶれと設定だけ。本体の接続は毎回えらぶ) ──────────
const STORE = 'ponkey_duet_v2';
function save() {
  try { localStorage.setItem(STORE, JSON.stringify({ parts: S.parts.map(p => ({ kind: p.kind, persona: p.persona, part: p.part })), bpm: S.bpm, wild: S.wild, trig: S.trig, sound: S.sound })); } catch (e) {}
}
function load() {
  let st = null; try { st = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) {}
  if (st && Array.isArray(st.parts) && st.parts.length) {
    st.parts.forEach(x => {
      if (x.kind === 'human') addPart('human');
      else if (PERSONAS[x.persona]) { addPart('ai', x.persona); const p = S.parts[S.parts.length - 1]; if (MEL.includes(x.part)) setPartColor(p, x.part); }
    });
    S.bpm = clamp(st.bpm | 0 || 100, 60, 187); S.wild = clamp(+st.wild || 1, .6, 1.6); S.trig = clamp(st.trig | 0 || 4, 2, 8); S.sound = st.sound !== false;
  } else {
    addPart('human'); addPart('ai', 'tako'); addPart('ai', 'kame');
  }
}

// ── 操作 ───────────────────────────────────────────────────────────────
function bindControls() {
  const bpm = document.getElementById('bpm'), wild = document.getElementById('wild'), trig = document.getElementById('trig');
  bpm.value = S.bpm; wild.value = S.wild; trig.value = S.trig;
  document.getElementById('bpmVal').textContent = S.bpm;
  document.getElementById('wildVal').textContent = S.wild.toFixed(1);
  document.getElementById('trigVal').textContent = S.trig;
  bpm.oninput = () => { S.bpm = +bpm.value; document.getElementById('bpmVal').textContent = S.bpm; };
  bpm.onchange = () => { sendBPM(); save(); };
  wild.oninput = () => { S.wild = +wild.value; document.getElementById('wildVal').textContent = S.wild.toFixed(1); save(); };
  trig.oninput = () => { S.trig = +trig.value; document.getElementById('trigVal').textContent = S.trig; save(); updateHint(); };
  const sb = document.getElementById('soundBtn');
  const paintSound = () => { sb.textContent = S.sound ? 'ON' : 'OFF'; sb.classList.toggle('on', S.sound); };
  paintSound(); sb.onclick = () => { S.sound = !S.sound; paintSound(); save(); };
  document.getElementById('addAi').onclick = () => { addPart('ai'); renderAll(); };
  document.getElementById('addHuman').onclick = () => {
    const boards = ['screen', ...S.devices.map(d => 'd' + d.id)];
    if (S.parts.filter(p => p.kind === 'human').length >= boards.length) {
      updateHint('「あなた」は盤面ごとに1人まで。先に PONKEY をもう1台つないでください'); return;
    }
    addPart('human');
    const p = S.parts[S.parts.length - 1];
    const free = boards.find(b => !S.parts.some(x => x !== p && x.kind === 'human' && boardKey(x) === b));
    p.dev = free === 'screen' ? null : +free.slice(1);
    renderAll();
  };
  const ab = document.getElementById('autoBtn');
  ab.onclick = () => {
    S.auto = !S.auto;
    ab.classList.toggle('on', S.auto); ab.textContent = S.auto ? '■ とめる' : '▶ AIだけで回す';
    if (S.auto) {
      if (!S.parts.some(p => p.kind === 'ai')) { addPart('ai'); renderAll(); }
      S.round++;
      // お題: 最後に鳴ったフレーズ、無ければドミソの上り下り (1小節)
      const seed = S.last && S.last.notes.length ? S.last
        : { from: 0, notes: [60, 64, 67, 72, 67, 64, 62, 60].map((p, i) => ({ pitch: p, start: i * 2, dur: 2 })), total: 16 };
      respond(seed, S.round);
    } else {
      S.round++; S.parts.forEach(p => { p.thinking = false; }); refreshAvatars();
    }
    updateHint();
  };
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(renderStage, 150); });
  window.addEventListener('beforeunload', () => S.devices.forEach(d => { try { d.pk.ledClear(); } catch (e) {} }));
}

// ── Boot ───────────────────────────────────────────────────────────────
load();
bindControls();
renderAll();
loadAI();
</script>
